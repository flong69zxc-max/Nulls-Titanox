          errors = []


          def fail(msg):
              errors.append(msg)
              print("FAIL " + msg)


          def read(path):
              with open(path, "r", encoding="utf-8", errors="surrogateescape") as f:
                  return f.read()


          def code_chars(text):
              out = []
              i = 0
              n = len(text)
              while i < n:
                  c = text[i]
                  if c == '"' or c == "'":
                      q = c
                      i += 1
                      while i < n:
                          if text[i] == "\\" and i + 1 < n:
                              i += 2
                              continue
                          ch = text[i]
                          i += 1
                          if ch == q or ch == "\n":
                              break
                      continue
                  if c == "/" and i + 1 < n and text[i + 1] == "/":
                      while i < n and text[i] != "\n":
                          i += 1
                      continue
                  if c == "/" and i + 1 < n and text[i + 1] == "*":
                      j = text.find("*/", i + 2)
                      i = n if j == -1 else j + 2
                      continue
                  out.append(c)
                  i += 1
              return "".join(out)


          def strip_hash_line(line):
              out = []
              i = 0
              n = len(line)
              quote = None
              while i < n:
                  c = line[i]
                  if quote is None:
                      if c == "\\":
                          out.append(c)
                          if i + 1 < n:
                              out.append(line[i + 1])
                          i += 2
                          continue
                      if c == "'" or c == '"':
                          quote = c
                          out.append(c)
                          i += 1
                          continue
                      if c == "#" and (i == 0 or line[i - 1] in " \t"):
                          break
                      out.append(c)
                      i += 1
                      continue
                  out.append(c)
                  if c == "\\" and i + 1 < n:
                      out.append(line[i + 1])
                      i += 2
                      continue
                  if c == quote:
                      quote = None
                  i += 1
              return "".join(out).rstrip()


          def source_files():
              found = []
              for base, dirs, files in os.walk("."):
                  dirs[:] = [d for d in dirs if d != ".git"]
                  for name in files:
                      if name.endswith(SRC_EXT):
                          found.append(os.path.join(base, name)[2:])
              return sorted(found)


          def hash_files():
              found = []
              for base, dirs, files in os.walk("."):
                  dirs[:] = [d for d in dirs if d != ".git"]
                  for name in files:
                      if name == "Makefile" or name.endswith(".sh") or name in SHELL_NAMES:
                          found.append(os.path.join(base, name)[2:])
              return sorted(found)


          def drop_shebang(text):
              lines = text.split("\n")
              if lines and lines[0].startswith("#!"):
                  lines = lines[1:]
              return "\n".join(lines)


          def logical_lines(text):
              lines = drop_shebang(text).split("\n")
              out = []
              cur = ""
              for line in lines:
                  if line.rstrip().endswith("\\"):
                      cur += line.rstrip()[:-1] + " "
                      continue
                  cur += line
                  out.append(cur)
                  cur = ""
              if cur:
                  out.append(cur)
              return out


          def code_projection(text):
              res = []
              for line in logical_lines(text):
                  stripped = strip_hash_line(line)
                  if stripped.strip():
                      res.append(stripped)
              return res


          def check_comments():
              dirty = []
              c_files = source_files()
              h_files = hash_files()
              for path in c_files:
                  body = code_chars(read(path))
                  if "//" in body or "/*" in body or "*/" in body:
                      dirty.append(path)
              for path in h_files:
                  lines = read(path).split("\n")
                  for idx, line in enumerate(lines):
                      if idx == 0 and line.startswith("#!"):
                          continue
                      if strip_hash_line(line) != line.rstrip():
                          dirty.append(path)
                          break
              if dirty:
                  for path in dirty:
                      fail("comments left in " + path)
              else:
                  print("ok comments: " + str(len(c_files) + len(h_files)) + " files clean")


          def check_braces():
              bad = []
              for path in source_files():
                  body = code_chars(read(path))
                  if body.count("{") != body.count("}") or body.count("(") != body.count(")"):
                      bad.append(path)
              if bad:
                  for path in bad:
                      fail("unbalanced braces in " + path)
              else:
                  print("ok braces: balanced")


          def blank_includes(text):
              out = []
              for line in text.split("\n"):
                  s = line.lstrip()
                  if s.startswith("#include") or s.startswith("#import") or s.startswith("#pragma once"):
                      out.append("")
                  else:
                      out.append(line.replace("#import", "#include"))
              return "\n".join(out)


          def preprocess(text):
              handle, path = tempfile.mkstemp(suffix=".c", dir="/tmp")
              with os.fdopen(handle, "w", encoding="utf-8", errors="surrogateescape") as f:
                  f.write(blank_includes(text))
              proc = subprocess.run(
                  ["gcc", "-E", "-P", "-dD", "-nostdinc", "-Wno-unknown-pragmas",
                   "-D__has_feature(x)=0", "-x", "c", path],
                  capture_output=True, text=True)
              os.unlink(path)
              return proc.returncode, proc.stdout


          def check_code_untouched():
              checked = 0
              for path in source_files():
                  if path in REWRITTEN:
                      continue
                  old = subprocess.run(["git", "show", "HEAD:" + path], capture_output=True, text=True)
                  if old.returncode != 0:
                      continue
                  new = read(path)
                  if old.stdout == new:
                      continue
                  rc_a, out_a = preprocess(old.stdout)
                  rc_b, out_b = preprocess(new)
                  if rc_a != rc_b or out_a != out_b:
                      fail("preprocessing changed for " + path)
                      continue
                  checked += 1
              print("ok code untouched: " + str(checked) + " stripped files match git HEAD")


          EDITED_MAKE_LINES = ("Titanox_FILES", "Titanox_CFLAGS", "Titanox_CCFLAGS", "Titanox_OBJCFLAGS")


          def keep_line(line):
              return not line.strip().startswith(EDITED_MAKE_LINES)


          def check_hash_untouched():
              checked = 0
              for path in hash_files():
                  old = subprocess.run(["git", "show", "HEAD:" + path], capture_output=True, text=True)
                  if old.returncode != 0:
                      continue
                  new = read(path)
                  if old.stdout == new:
                      continue
                  before = [l for l in code_projection(old.stdout) if keep_line(l)]
                  after = [l for l in code_projection(new) if keep_line(l)]
                  if before != after:
                      fail("make code changed in " + path + " by comment stripping")
                      continue
                  checked += 1
              print("ok make code untouched: " + str(checked) + " stripped files match git HEAD")


          def check_contract():
              tweak = read(SHELL_TWEAK)
              for parts in CONTRACT:
                  for part in parts:
                      if part not in tweak:
                          fail("tweak does not use " + part)
              for bad in FORBIDDEN_IN_SRC:
                  for name in os.listdir("src"):
                      body = read(os.path.join("src", name))
                      if bad in body:
                          fail("hook plumbing " + bad + " leaked into src/" + name)
              for needed in REQUIRED_IN_TWEAK:
                  if needed not in tweak:
                      fail("tweak lacks " + needed)
              offsets = read("src/offsets.h")
              if "RVA_MESSAGEMANAGER_RECEIVEMESSAGE 0x75cce0" not in offsets:
                  fail("offsets.h lost the receiveMessage RVA")
              print("ok contract: tweak uses the library API and owns no plumbing")


          def check_layout():
              makefile = read("Makefile")
              if "$(wildcard src/*.mm)" not in makefile:
                  fail("Makefile does not glob src/*.mm")
              if "TitanoxImpl" in makefile:
                  fail("Makefile still lists TitanoxImpl.mm")
              if "! -name 'main.mm'" in makefile:
                  fail("Makefile still excludes the vendored main.mm")
              for path in LEGACY_PATHS:
                  if os.path.exists(path):
                      fail(path + " should be gone")
              for path in (SHELL_TWEAK, LOGGER, "src/offsets.h", "control",
                           "layout/Library/MobileSubstrate/DynamicLibraries/Titanox.plist",
                           ".gitignore", "README.md", "Makefile"):
                  if not os.path.isfile(path):
                      fail(path + " is missing")
              if "deps/" not in read(".gitignore"):
                  fail(".gitignore does not ignore deps/")
              print("ok layout: src/*.mm glob, no legacy files, control and filter plist in place")


          def check_makefile_parses():
              root = "/tmp/theos_stub"
              mkdir = os.path.join(root, "makefiles")
              if not os.path.isdir(mkdir):
                  os.makedirs(mkdir)
              with open(os.path.join(mkdir, "common.mk"), "w", encoding="utf-8") as f:
                  f.write("")
              with open(os.path.join(mkdir, "tweak.mk"), "w", encoding="utf-8") as f:
                  f.write("all:\n\t@true\n")
              proc = subprocess.run(["make", "-n", "-f", "Makefile", "THEOS=" + root,
                                     "THEOS_MAKE_PATH=" + mkdir], capture_output=True, text=True)
              if proc.returncode != 0:
                  fail("Makefile does not parse")
                  print((proc.stderr or proc.stdout)[:500])
              else:
                  print("ok makefile: parses with stub theos makefiles")


          def check_syntax():
              root = "/tmp/nulls_stub"
              for rel, body in STUBS.items():
                  path = os.path.join(root, rel)
                  d = os.path.dirname(path)
                  if d and not os.path.isdir(d):
                      os.makedirs(d)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(body)
              clang = subprocess.run(
                  ["clang", "-fsyntax-only", "-fobjc-arc", "-fobjc-runtime=gnustep-2.0", "-fblocks", "-Wno-objc-root-class",
                   "-Wno-unused-parameter", "-x", "objective-c++", "-I", root, "-I", "src",
                   SHELL_TWEAK, LOGGER],
                  capture_output=True, text=True)
              if clang.returncode != 0:
                  fail("objc++ syntax check failed")
                  print(clang.stderr[:4000])
              else:
                  print("ok syntax: tweak and logger compile clean against stub headers")


          def main():
              os.chdir(ROOT)
              check_comments()
              check_braces()
              check_hash_untouched()
              check_code_untouched()
              check_makefile_parses()
              check_contract()
              check_layout()
              check_syntax()
              if errors:
                  print("VERIFY FAILED: " + str(len(errors)))
                  sys.exit(1)
              print("VERIFY OK")


          main()

          PYVERIFY

      - name: Commit
        run: |
          git config user.name titanox-bot
          git config user.email titanox-bot@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "repo tidy: hook tweak, logger split, comments gone"
          git push || (git pull --rebase && git push)
