name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      THEOS: ${{ github.workspace }}/.theos

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/cache@v4
        with:
          path: |
            .theos
            ~/Library/Caches/ccache
          key: theos-${{ runner.os }}-${{ hashFiles('Makefile') }}-v2

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-ccache

      - name: Setup
        run: |
          set -euo pipefail
          brew install ldid make ccache >/dev/null 2>&1 || true
          [ -d "$THEOS" ] || git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 https://github.com/flong69zxc-max/Titanox.git deps/Titanox
          rm -rf deps/Titanox/.git

      - name: Build
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/ccache/libexec:$PATH"
          gmake -j$(sysctl -n hw.ncpu) ARCHS=arm64 \
            CC="ccache clang" CXX="ccache clang++"
          find .theos/obj -name '*.dylib' -exec cp {} Titanox.dylib \;
          file Titanox.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: Titanox
          path: Titanox.dylib
          retention-days: 30