name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      THEOS: ${{ github.workspace }}/.theos

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Cache Theos + brew
        uses: actions/cache@v4
        with:
          path: |
            .theos
            ~/Library/Caches/Homebrew
          key: theos-${{ runner.os }}-v1

      - name: Setup
        run: |
          set -euo pipefail
          brew install ldid dpkg make >/dev/null 2>&1 || true
          [ -d "$THEOS" ] || git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/lib" "$THEOS/include/Titanox" deps

          git clone --depth 1 https://github.com/flong69zxc-max/Titanox.git deps/Titanox
          rm -rf deps/Titanox/.git

          find deps/Titanox \( -name 'sih.hpp' -o -name 'sih.mm' \) -exec \
            sed -i '' 's|"__TITANOX_HOOK"|"__TITANOX_DATA"|g' {} +
          find deps/Titanox -name 'hook.c' -exec \
            sed -i '' 's|arm_thread_state64_set_pc_fptr(\*new, hooks\[i\].new)|arm_thread_state64_set_pc_fptr(*new, (void *)hooks[i].new)|g' {} +

          (cd deps/Titanox && find . -name '*.h*' -exec sh -c \
            'd="$THEOS/include/Titanox/$(dirname "${1#./}")"; mkdir -p "$d"; cp "$1" "$d/"' _ {} \;)
          find deps/Titanox -name 'libtitanox.h' -exec cp {} "$THEOS/include/Titanox/" \;

          if [ ! -f Titanox.plist ] && [ ! -f Filter.plist ] && [ ! -f layout/Library/MobileSubstrate/DynamicLibraries/Titanox.plist ]; then
            printf '{\n  Filter = { Bundles = ( "com.apple.springboard" ); };\n}\n' > Titanox.plist
          fi

      - name: Build + package
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CXXINC=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/include/c++/v1
          EXTRA="-isystem $CXXINC -I$THEOS/include -I$THEOS/include/Titanox -Ideps/Titanox/include -Ideps/Titanox/libtitanox -Ideps/Titanox"

          sed -i '' "s|^SYSROOT =.*|SYSROOT = $SDK|" Makefile
          printf '\nADDITIONAL_CFLAGS += %s\nADDITIONAL_CXXFLAGS += %s\n' "$EXTRA" "$EXTRA" >> Makefile

          gmake -j$(sysctl -n hw.ncpu) package FINALPACKAGE=1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build
          path: |
            packages/**
            .theos/obj/**/*.dylib
          retention-days: 30
          if-no-files-found: warn