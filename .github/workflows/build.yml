name: Titanox

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: theos
          key: theos-${{ runner.os }}

      - name: Setup Theos
        run: |
          [ -d theos ] || git clone --recursive --depth 1 --shallow-submodules https://github.com/theos/theos.git theos
          brew install ldid make
          echo "THEOS=$PWD/theos" >> $GITHUB_ENV
          echo "$PWD/theos/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: Get Titanox
        run: |
          rm -rf deps/Titanox
          git clone --depth 1 https://github.com/flong69zxc-max/Titanox.git deps/Titanox
          rm -rf deps/Titanox/.git

      - name: Build
        run: |
          gmake -j$(sysctl -n hw.ncpu) ARCHS=arm64 DEBUG=0 FINALPACKAGE=1

      - name: Package
        run: |
          mkdir -p out
          find .theos -type f -name '*.dylib' ! -path '*.dSYM*' -exec cp {} out/Titanox.dylib \;

      - uses: actions/upload-artifact@v4
        with:
          name: Titanox
          path: out/Titanox.dylib
          if-no-files-found: error