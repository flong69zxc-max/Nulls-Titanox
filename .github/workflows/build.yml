name: Build Titanox

on:
  push:
    branches: [main]
    paths-ignore:
      - Makefile
      - layout/**
      - Info.plist
      - control
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
      TARGET_CODESIGN: ":"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-v1

      - name: Install Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        uses: Randomblock1/theos-action@v1

      - name: Cache Titanox
        id: cache-titanox
        uses: actions/cache@v4
        with:
          path: deps/Titanox
          key: titanox-v4

      - name: Clone Titanox
        if: steps.cache-titanox.outputs.cache-hit != 'true'
        run: |
          mkdir -p deps
          git clone --depth 1 https://github.com/Ragekill3377/Titanox.git deps/Titanox

      - name: Patch hook.c
        run: |
          HOOK_C="deps/Titanox/libtitanox/brk_hook/Hook/hook.c"
          if ! grep -q "#include <ptrauth.h>" "$HOOK_C"; then
            sed -i '' '1i\
          #include <ptrauth.h>
          ' "$HOOK_C"
          fi
          sed -i '' 's/arm_thread_state64_set_pc_fptr(\*new, hooks\[i\].new);/arm_thread_state64_set_pc_fptr(*new, ptrauth_sign_unauthenticated((void *)hooks[i].new, ptrauth_key_function_pointer, 0));/g' "$HOOK_C"
          sed -i '' 's/arm_thread_state64_set_pc_fptr(\*new, (void \*)hooks\[i\].new);/arm_thread_state64_set_pc_fptr(*new, ptrauth_sign_unauthenticated((void *)hooks[i].new, ptrauth_key_function_pointer, 0));/g' "$HOOK_C"
          grep -n "ptrauth\|arm_thread_state64_set_pc_fptr" "$HOOK_C"

      - name: Build
        run: |
          make clean || true
          make -j4

      - name: Package dylib
        run: |
          DYLIB=$(find .theos/obj -name "Titanox.dylib" ! -path "*/arm64/*" ! -path "*/arm64e/*" | head -n1)
          test -n "$DYLIB"
          lipo -archs "$DYLIB" | tr ' ' '\n' | grep -qx arm64
          lipo -archs "$DYLIB" | tr ' ' '\n' | grep -qx arm64e
          cp "$DYLIB" ./Titanox.dylib
          file ./Titanox.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: Titanox.dylib
          path: Titanox.dylib
          if-no-files-found: error