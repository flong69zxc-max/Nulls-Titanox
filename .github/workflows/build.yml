name: Build
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout tweak repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone Titanox
        run: |
          set -euo pipefail
          rm -rf libtitanox
          git clone --depth 1 https://github.com/flong69zxc-max/Titanox.git libtitanox
          rm -rf libtitanox/.git
          find libtitanox -maxdepth 3 -name Makefile

      - name: Install Theos
        run: |
          set -euo pipefail
          export THEOS=$RUNNER_TEMP/theos
          if [ ! -d "$THEOS" ]; then
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          fi
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install ldid
        run: brew install ldid || true

      - name: Locate SDKs and toolchain
        id: paths
        run: |
          set -euo pipefail
          XCSDK=$(xcrun --sdk iphoneos --show-sdk-path)
          TOOLCHAIN=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain
          CXXINC="$TOOLCHAIN/usr/include/c++/v1"
          echo "XCSDK=$XCSDK"
          echo "TOOLCHAIN=$TOOLCHAIN"
          echo "CXXINC=$CXXINC"
          test -d "$XCSDK"
          test -d "$CXXINC"
          ls "$CXXINC" | head -5
          echo "xcsdk=$XCSDK" >> "$GITHUB_OUTPUT"
          echo "cxxinc=$CXXINC" >> "$GITHUB_OUTPUT"

      - name: Patch duplicate segment name
        run: |
          set -euo pipefail
          find libtitanox \( -name "sih.hpp" -o -name "sih.mm" \) -print | while read f; do
            sed -i.bak 's|HOOK_DATA_SEGMENT = "__TITANOX_HOOK"|HOOK_DATA_SEGMENT = "__TITANOX_DATA"|g' "$f"
            rm -f "$f.bak"
          done
          grep -rn "HOOK_DATA_SEGMENT\|HOOK_TEXT_SEGMENT" libtitanox | head || true

      - name: Build libtitanox
        env:
          THEOS: ${{ env.THEOS }}
          XCSDK: ${{ steps.paths.outputs.xcsdk }}
          CXXINC: ${{ steps.paths.outputs.cxxinc }}
        run: |
          set -euo pipefail
          MK=$(find libtitanox -maxdepth 3 -name Makefile | head -1)
          DIR=$(dirname "$MK")
          echo "MK=$MK DIR=$DIR"

          sed -i.bak "s|/home/rage/theos|$THEOS|g" "$MK"
          sed -i.bak "s|SYSROOT = .*|SYSROOT = $XCSDK|g" "$MK"
          sed -i.bak "s|^\(.*\)_CFLAGS *= *|\1_CFLAGS = -isystem $CXXINC |" "$MK"
          echo "" >> "$MK"
          echo "ADDITIONAL_CFLAGS = -isystem $CXXINC" >> "$MK"
          echo "ADDITIONAL_CXXFLAGS = -isystem $CXXINC" >> "$MK"
          echo "CFLAGS += -isystem $CXXINC" >> "$MK"
          echo "CXXFLAGS += -isystem $CXXINC" >> "$MK"

          echo "--- Makefile after patch ---"
          cat "$MK"

          cd "$DIR"
          make clean || true
          make -j4 CFLAGS="-isystem $CXXINC" CXXFLAGS="-isystem $CXXINC"

          cd "$GITHUB_WORKSPACE"
          DYLIB=$(find libtitanox \( -name "libtitanox.dylib" -o -name "Titanox.dylib" \) 2>/dev/null | head -1)
          test -n "$DYLIB"
          file "$DYLIB"
          mkdir -p "$THEOS/lib"
          cp "$DYLIB" "$THEOS/lib/libtitanox.dylib"

      - name: Build tweak
        env:
          THEOS: ${{ env.THEOS }}
          XCSDK: ${{ steps.paths.outputs.xcsdk }}
          CXXINC: ${{ steps.paths.outputs.cxxinc }}
        run: |
          set -euo pipefail
          if [ -f Makefile ]; then
            sed -i.bak "s|SYSROOT = .*|SYSROOT = $XCSDK|g" Makefile || true
          fi
          make clean || true
          make -j4 CFLAGS="-isystem $CXXINC" CXXFLAGS="-isystem $CXXINC" || \
            make -j4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build
          path: |
            packages/**
            .theos/obj/**/*.dylib
            libtitanox/**/*.deb
          retention-days: 30
          if-no-files-found: warn