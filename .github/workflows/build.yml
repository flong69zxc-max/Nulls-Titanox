name: Build Tweak
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Makefile'
      - 'control'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Theos
        run: |
          set -euo pipefail
          export THEOS=$RUNNER_TEMP/theos
          if [ ! -d "$THEOS" ]; then
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          fi
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          ls -la "$THEOS" | head

      - name: Install ldid
        run: |
          set -euo pipefail
          brew install ldid || true

      - name: Patch duplicate segment name
        run: |
          set -euo pipefail
          grep -rl 'HOOK_DATA_SEGMENT.*"__TITANOX_HOOK"' . 2>/dev/null | while read f; do
            echo "patch $f"
            sed -i.bak 's/HOOK_DATA_SEGMENT.*"__TITANOX_HOOK"/HOOK_DATA_SEGMENT = "__TITANOX_DATA"/' "$f"
            rm -f "$f.bak"
          done
          grep -rn 'HOOK_TEXT_SEGMENT\|HOOK_DATA_SEGMENT' . | head || true

      - name: Build
        env:
          THEOS: ${{ env.THEOS }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          find . -maxdepth 2 -name Makefile | head
          make clean || true
          make -j4

      - name: Find artifacts
        id: find
        run: |
          set -euo pipefail
          echo "--- deb files ---"
          find . -name "*.deb" -type f 2>/dev/null | head || true
          echo "--- dylib files ---"
          find . -name "*.dylib" -type f 2>/dev/null | head || true
          DEB=$(find . -name "*.deb" -type f 2>/dev/null | head -n1 || true)
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tweak-build
          path: |
            **/*.deb
            **/*.dylib
            .theos/obj/**/*.dylib
          retention-days: 30
          if-no-files-found: warn

      - name: Report
        if: always()
        run: |
          echo "=== repo tree ==="
          find . -maxdepth 2 -type d | head -30
          echo "=== Makefile ==="
          cat Makefile 2>/dev/null || echo "(no root Makefile)"
          echo "=== control ==="
          cat control 2>/dev/null || echo "(no control)"