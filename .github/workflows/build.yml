name: tidy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Makefile'
      - 'control'
      - '**.plist'

permissions:
  contents: write

concurrency:
  group: tidy
  cancel-in-progress: false

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply fix
        run: |
          python3 - <<'PYFIX'
          import os
          import sys

          ROOT = os.getcwd()
          SRC_EXT = (".c", ".h", ".mm", ".m", ".hpp", ".cpp", ".cc", ".tpp", ".swift")
          SHELL_NAMES = ("build", "size", "githelper")


          def die(msg):
              print("FAIL: " + msg)
              sys.exit(1)


          def note(msg):
              print("  " + msg)


          def read(path):
              with open(path, "r", encoding="utf-8", errors="surrogateescape") as f:
                  return f.read()


          def write(path, text):
              d = os.path.dirname(path)
              if d and not os.path.isdir(d):
                  os.makedirs(d)
              with open(path, "w", encoding="utf-8", errors="surrogateescape") as f:
                  f.write(text)


          def strip_comments(text):
              out = []
              i = 0
              n = len(text)
              while i < n:
                  c = text[i]
                  if c == '"' or c == "'":
                      q = c
                      out.append(c)
                      i += 1
                      while i < n:
                          ch = text[i]
                          if ch == "\\" and i + 1 < n:
                              out.append(ch)
                              out.append(text[i + 1])
                              i += 2
                              continue
                          out.append(ch)
                          i += 1
                          if ch == q:
                              break
                          if ch == "\n":
                              break
                      continue
                  if c == "/" and i + 1 < n and text[i + 1] == "/":
                      while i < n:
                          j = text.find("\n", i)
                          if j == -1:
                              j = n
                          back = (j > 0 and text[j - 1] == "\\")
                          i = j
                          if not back:
                              break
                      out.append("\n")
                      continue
                  if c == "/" and i + 1 < n and text[i + 1] == "*":
                      j = text.find("*/", i + 2)
                      if j == -1:
                          j = n
                      else:
                          j += 2
                      out.append("\n" * text.count("\n", i, j))
                      i = j
                      continue
                  out.append(c)
                  i += 1
              lines = []
              for line in "".join(out).split("\n"):
                  lines.append(line.rstrip())
              return "\n".join(lines)


          def has_comment(text):
              i = 0
              n = len(text)
              while i < n:
                  c = text[i]
                  if c == '"' or c == "'":
                      q = c
                      i += 1
                      while i < n:
                          ch = text[i]
                          if ch == "\\" and i + 1 < n:
                              i += 2
                              continue
                          i += 1
                          if ch == q or ch == "\n":
                              break
                      continue
                  if c == "/" and i + 1 < n and text[i + 1] in "/*":
                      return True
                  i += 1
              return False


          def strip_hash_line(line):
              out = []
              i = 0
              n = len(line)
              quote = None
              while i < n:
                  c = line[i]
                  if quote is None:
                      if c == "\\":
                          out.append(c)
                          if i + 1 < n:
                              out.append(line[i + 1])
                          i += 2
                          continue
                      if c == "'" or c == '"':
                          quote = c
                          out.append(c)
                          i += 1
                          continue
                      if c == "#" and (i == 0 or line[i - 1] in " \t"):
                          break
                      out.append(c)
                      i += 1
                      continue
                  out.append(c)
                  if c == "\\" and i + 1 < n:
                      out.append(line[i + 1])
                      i += 2
                      continue
                  if c == quote:
                      quote = None
                  i += 1
              return "".join(out).rstrip()


          def strip_hash_comments(text):
              lines = text.split("\n")
              out = []
              i = 0
              n = len(lines)
              while i < n:
                  line = lines[i]
                  if i == 0 and line.startswith("#!"):
                      out.append(line.rstrip())
                      i += 1
                      continue
                  stripped = strip_hash_line(line)
                  if not stripped and line.lstrip().startswith("#") and line.rstrip().endswith("\\"):
                      j = i + 1
                      while j < n:
                          cont = lines[j].rstrip().endswith("\\")
                          j += 1
                          if not cont:
                              break
                      i = j
                      continue
                  if stripped.endswith("\\") and not line.rstrip().endswith("\\"):
                      stripped = stripped[:-1].rstrip()
                  out.append(stripped)
                  i += 1
              return "\n".join(out)


          def has_hash_comment(text):
              lines = text.split("\n")
              for idx, line in enumerate(lines):
                  if idx == 0 and line.startswith("#!"):
                      continue
                  if strip_hash_line(line) != line.rstrip():
                      return True
              return False


          def source_files():
              found = []
              for base, dirs, files in os.walk("."):
                  dirs[:] = [d for d in dirs if d != ".git"]
                  for name in files:
                      if name.endswith(SRC_EXT):
                          found.append(os.path.join(base, name)[2:])
              return sorted(found)


          def hash_files():
              found = []
              for base, dirs, files in os.walk("."):
                  dirs[:] = [d for d in dirs if d != ".git"]
                  for name in files:
                      if name == "Makefile" or name.endswith(".sh") or name in SHELL_NAMES:
                          found.append(os.path.join(base, name)[2:])
              return sorted(found)


          TWEAK_MM = r'''#import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <mach-o/dyld.h>
          #import <dlfcn.h>
          #import <mach-o/loader.h>
          #import <string.h>
          #import "libtitanox.h"
          #import "offsets.h"

          static uintptr_t g_base = 0;
          static uintptr_t g_target = 0;
          static volatile int g_hits = 0;
          static unsigned char g_bytes[4] = {0, 0, 0, 0};
          static NSString *g_status = @"";
          static bool g_presented = false;
          static bool g_reported_hit = false;

          typedef void (*recv_fn)(void *, void *, void *, void *, void *, void *);
          static recv_fn g_orig = NULL;

          static void recv_hook(void *self, void *msg, void *a, void *b, void *c, void *d) {
              g_hits++;
              if (g_orig == NULL) {
                  return;
              }
              [TitanoxHook suspendBreakpoints];
              g_orig(self, msg, a, b, c, d);
              [TitanoxHook resumeBreakpoints];
          }

          static uintptr_t own_image(void) {
              Dl_info info;
              if (dladdr((void *)&recv_hook, &info) == 0) {
                  return 0;
              }
              return (uintptr_t)info.dli_fbase;
          }

          static uintptr_t image_for_rva(uint64_t rva) {
              uintptr_t mine = own_image();
              uint32_t image_count = _dyld_image_count();
              for (uint32_t i = 0; i < image_count; i++) {
                  const char *path = _dyld_get_image_name(i);
                  const struct mach_header_64 *hdr = (const struct mach_header_64 *)_dyld_get_image_header(i);
                  if (path == NULL || hdr == NULL || hdr->magic != MH_MAGIC_64) {
                      continue;
                  }
                  if ((uintptr_t)hdr == mine) {
                      continue;
                  }
                  if (strstr(path, "/System/") || strstr(path, "LiveContainer") || strstr(path, "TweakLoader")) {
                      continue;
                  }
                  if (strstr(path, ".dylib") != NULL) {
                      continue;
                  }
                  uint32_t cmd_count = hdr->ncmds;
                  if (cmd_count > 1024) {
                      cmd_count = 1024;
                  }
                  const struct load_command *cmd =
                      (const struct load_command *)((const uint8_t *)hdr + sizeof(struct mach_header_64));
                  uint64_t origin = 0;
                  bool have_origin = false;
                  for (uint32_t c = 0; c < cmd_count; c++) {
                      if (cmd->cmdsize < sizeof(struct load_command)) {
                          break;
                      }
                      if (cmd->cmd == LC_SEGMENT_64) {
                          const struct segment_command_64 *seg = (const struct segment_command_64 *)cmd;
                          if (!have_origin) {
                              origin = seg->vmaddr;
                              have_origin = true;
                          }
                          uint64_t rel = seg->vmaddr - origin;
                          if ((seg->initprot & VM_PROT_EXECUTE) && rva >= rel && rva < rel + seg->vmsize) {
                              return (uintptr_t)hdr;
                          }
                      }
                      cmd = (const struct load_command *)((const uint8_t *)cmd + cmd->cmdsize);
                  }
              }
              return 0;
          }

          static NSString *arm_hook(void) {
              NSMutableString *out = [NSMutableString string];

              [out appendFormat:@"hw breakpoints: %d\n", [TitanoxHook breakpointSlotLimit]];
              [out appendFormat:@"selftest: %s\n", [TitanoxHook breakpointSelfTest] ? "pass" : "fail"];

              g_base = image_for_rva(RVA_MESSAGEMANAGER_RECEIVEMESSAGE);
              if (g_base == 0) {
                  [out appendString:@"game image not found"];
                  return out;
              }

              g_target = g_base + RVA_MESSAGEMANAGER_RECEIVEMESSAGE;
              [out appendFormat:@"base: %p\ntarget: %p\n", (void *)g_base, (void *)g_target];

              if (![TitanoxHook readMemoryAt:g_target buffer:g_bytes size:sizeof(g_bytes)]) {
                  [out appendString:@"target is not readable"];
                  return out;
              }
              [out appendFormat:@"bytes: %02x %02x %02x %02x\n",
                                g_bytes[0], g_bytes[1], g_bytes[2], g_bytes[3]];

              g_orig = (recv_fn)[TitanoxHook originalPointerForBreakpoint:(void *)g_target];

              BOOL installed = [TitanoxHook addBreakpointAtAddress:(void *)g_target withHook:(void *)&recv_hook];
              [out appendFormat:@"hook: %s\n", installed ? "installed" : "failed"];
              [out appendString:installed ? @"send a packet in game" : @"no free slots or bad target"];

              return out;
          }

          static UIViewController *top_controller(void) {
              for (UIScene *scene in UIApplication.sharedApplication.connectedScenes) {
                  if (![scene isKindOfClass:UIWindowScene.class]) {
                      continue;
                  }
                  UIWindow *window = ((UIWindowScene *)scene).keyWindow;
                  if (window.rootViewController != nil) {
                      return window.rootViewController;
                  }
              }
              return nil;
          }

          static void show_status(void) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (g_hits > 0 && g_reported_hit) {
                      return;
                  }
                  if (g_hits == 0 && g_presented) {
                      return;
                  }
                  if (g_hits > 0) {
                      g_reported_hit = true;
                  }
                  g_presented = true;

                  UIViewController *root = top_controller();
                  if (root == nil) {
                      return;
                  }

                  for (UIViewController *vc in root.presentedViewControllers) {
                      if ([vc isKindOfClass:UIAlertController.class]) {
                          [(UIAlertController *)vc dismissViewControllerAnimated:NO completion:nil];
                      }
                  }

                  NSString *title = g_hits > 0 ? @"Hook fired" : @"Hook armed";
                  NSString *message = [NSString stringWithFormat:
                      @"%@\n\nhw bp: %d\ntarget: %p\nbytes: %02x %02x %02x %02x\nhits: %d\noriginal: %s",
                      g_status, [TitanoxHook breakpointSlotLimit], (void *)g_target,
                      g_bytes[0], g_bytes[1], g_bytes[2], g_bytes[3],
                      g_hits, g_orig != NULL ? "wired" : "missing"];

                  UIAlertController *alert = [UIAlertController
                      alertControllerWithTitle:title
                      message:message
                      preferredStyle:UIAlertControllerStyleAlert];
                  [alert addAction:[UIAlertAction actionWithTitle:@"OK"
                      style:UIAlertActionStyleDefault handler:nil]];
                  [root presentViewController:alert animated:YES completion:nil];
              });
          }

          __attribute__((constructor))
          static void tweak_start(void) {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(5 * NSEC_PER_SEC)),
                             dispatch_get_main_queue(), ^{
                  g_status = arm_hook();
                  show_status();
                  [NSTimer scheduledTimerWithTimeInterval:2.0 repeats:YES block:^(NSTimer *timer) {
                      show_status();
                  }];
              });
          }
          '''

          MAKEFILE = r'''TARGET = iphone:clang:latest:14.0
          ARCHS = arm64 arm64e
          INSTALL_TARGET_PROCESSES = Nulls Brawl
          _THEOS_TARGET_CODESIGN = 0

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = Titanox
          Titanox_FILES = $(wildcard src/*.mm) $(shell find deps/Titanox/libtitanox -type f \( -name '*.mm' -o -name '*.m' -o -name '*.cpp' -o -name '*.cc' -o -name '*.c' -o -name '*.S' \))
          Titanox_CFLAGS = -I$(THEOS_PROJECT_DIR)/deps/Titanox/libtitanox/libtitanox -I$(THEOS_PROJECT_DIR)/src
          Titanox_CCFLAGS = -std=c++17 -Wno-everything -I$(THEOS_PROJECT_DIR)/deps/Titanox/libtitanox/libtitanox -I$(THEOS_PROJECT_DIR)/src
          Titanox_OBJCFLAGS = -fobjc-arc -I$(THEOS_PROJECT_DIR)/deps/Titanox/libtitanox/libtitanox -I$(THEOS_PROJECT_DIR)/src
          Titanox_FRAMEWORKS = Foundation UIKit
          Titanox_LIBRARIES = c++

          include $(THEOS_MAKE_PATH)/tweak.mk
          '''

          README_MD = '''# Nulls-Titanox

          Theos tweak for Nulls Brawl. Two things in here: a hardware breakpoint hook on the
          game's message handler, and a network logger that was used to work out the protocol.

          The actual hook engine is not in this repo. `deps/Titanox` is cloned during the build
          and provides `TitanoxHook` (`libtitanox.h`); this repo only decides what to hook.

          ## Layout

          ```
          src/Tweak.mm        hook test on MessageManager::receiveMessage
          src/NetLogger.mm    connect/send/recv/sendto/recvfrom/read/write/dns logging
          src/offsets.h       RVA table (main image, offsets measured from the mach header)
          layout/             plist filter for nt.nb.ios.app
          ```

          ## The hook

          `MessageManager::receiveMessage` sits at `RVA_MESSAGEMANAGER_RECEIVEMESSAGE`. It is not
          exported and nothing calls it through the GOT, so there is no symbol to rebind and no
          page to patch. Instead the address goes into a debug breakpoint register, an exception
          port catches the hit, and the thread continues inside `recv_hook`. Nothing is written to
          the game's code, which is why this works with the game running from a signed binary.

          The original is called straight through on the same address after
          `[TitanoxHook suspendBreakpoints]` drops the breakpoints of the calling thread for the
          duration of the call, then `[TitanoxHook resumeBreakpoints]` puts them back.

          The image is picked by walking `LC_SEGMENT_64` entries and looking for the one whose
          executable ranges contain the RVA, so no guessing by file name. The first four bytes at
          the target are read back and shown in the alert - if they are zeros or garbage, the RVA
          is for a different game build.

          ## Reading the result

          The tweak waits 5 seconds after injection and shows an alert: slot count, self test
          result, base, target, target bytes. When the hook fires for the first time the alert
          comes back once with the hit count, so it does not fight you for touch input.

          `selftest: fail` means the breakpoint mechanism itself is not working on that device and
          nothing below it will. `hook: failed` means no free slots or an unusable target address.
          `game image not found` means the RVA does not sit in any loaded executable segment.

          The image is also checked against the tweak's own dylib and against anything ending in
          `.dylib`, so a helper library with a similar size cannot be picked by mistake.

          ## Build

          ```
          git clone https://github.com/flong69zxc-max/Titanox deps/Titanox
          make package
          ```

          `deps/Titanox` is ignored by git, the build workflow fetches it on its own.

          ## Notes

          - RVAs are for one specific game build. After a game update the numbers move.
          - Six breakpoint slots per thread is the hardware limit, and they are per thread, not
            per process.
          - Each hit costs one exception round trip. Fine for a message handler, not something to
            put inside a render loop.
          - `deps/Titanox` must be the reworked Titanox: `libtitanox.h` has to declare
            `originalPointerForBreakpoint:`, `suspendBreakpoints`, `resumeBreakpoints`,
            `breakpointSelfTest` and `breakpointSlotLimit`. Without them this will not link.
          - `src/NetLogger.mm` writes `Documents/netlog.log` and starts on its own; delete the file
            if you only want the hook.

          ## Credits

          rage for Titanox and the breakpoint hook, Euclid Jan G. and Saagar Jha for the original
          brk hook, ElleKit for the idea.
          '''

          GITIGNORE = '''.DS_Store
          .theos/
          packages/
          deps/
          derived/
          *.deb
          *.dylib
          *.o
          *.a
          *.log
          '''

          LEGACY_IMPL = "src/TitanoxImpl.mm"
          LEGACY_PLIST = "Info.plist"


          FILES_LINE = ("Titanox_FILES = $(wildcard src/*.mm) $(shell find deps/Titanox/libtitanox -type f "
                        "\\( -name '*.mm' -o -name '*.m' -o -name '*.cpp' -o -name '*.cc' -o -name '*.c' -o -name '*.S' \\))")
          INCLUDE_FLAG = "-I$(THEOS_PROJECT_DIR)/src"


          def move_netlogger():
              legacy = "src/Tweak.mm"
              target = "src/NetLogger.mm"
              if not os.path.isfile(legacy):
                  note("src/Tweak.mm is missing")
                  return
              body = read(legacy)
              if "arm_hook" in body:
                  note("src/Tweak.mm is already the hook tweak")
                  return
              if os.path.isfile(target) and "TaleLog" in read(target):
                  note("src/NetLogger.mm already holds the logger")
                  return
              body = strip_comments(body).rstrip() + "\n"
              write(target, body)
              os.remove(legacy)
              note("network logger moved to src/NetLogger.mm")


          def patch_makefile():
              path = "Makefile"
              if not os.path.isfile(path):
                  write(path, MAKEFILE)
                  note("Makefile written")
                  return
              lines = read(path).split("\n")
              out = []
              for line in lines:
                  if line.startswith("Titanox_FILES"):
                      out.append(FILES_LINE)
                      continue
                  if line.startswith(("Titanox_CFLAGS", "Titanox_CCFLAGS", "Titanox_OBJCFLAGS")):
                      if INCLUDE_FLAG not in line:
                          out.append(line + " " + INCLUDE_FLAG)
                          continue
                  if "! -name 'main.mm'" in line or "src/TitanoxImpl.mm" in line:
                      continue
                  out.append(line)
              write(path, "\n".join(out))
              note("Makefile points at src/*.mm and the vendored main.mm")


          def drop_legacy():
              for path in (LEGACY_IMPL, LEGACY_PLIST):
                  if os.path.isfile(path):
                      os.remove(path)
                      note("removed " + path)


          def strip_all():
              print("stripping comments")
              changed = 0
              kept = 0
              for path in hash_files():
                  original = read(path)
                  if not has_hash_comment(original):
                      kept += 1
                      continue
                  write(path, strip_hash_comments(original))
                  changed += 1
                  print("  " + path)
              for path in source_files():
                  original = read(path)
                  if 'R"' in original:
                      die("raw string literal in " + path + ", stripper would be unsafe")
                  if has_comment(original):
                      stripped = strip_comments(original)
                      if has_comment(stripped):
                          die("comments left in " + path)
                      if strip_comments(stripped) != stripped:
                          die("stripper is not idempotent on " + path)
                      original = stripped
                      changed += 1
                      print("  " + path)
                  else:
                      kept += 1
                  normalized = original.rstrip() + "\n"
                  if normalized != original:
                      write(path, normalized)
              print("  stripped: " + str(changed) + ", already clean: " + str(kept))


          def main():
              os.chdir(ROOT)
              if not os.path.isdir("src"):
                  die("run this from the repository root")
              if not os.path.isfile("control"):
                  die("control file is missing, this does not look like the tweak repo")

              move_netlogger()
              write("src/Tweak.mm", TWEAK_MM)
              note("src/Tweak.mm rewritten")
              patch_makefile()
              drop_legacy()
              write(".gitignore", GITIGNORE)
              write("README.md", README_MD)
              note("README.md and .gitignore written")
              strip_all()
              print("DONE")


          main()

          PYFIX

      - name: Verify
        run: |
          python3 - <<'PYVERIFY'
          import os
          import subprocess
          import sys
          import tempfile

          ROOT = os.getcwd()
          SRC_EXT = (".c", ".h", ".mm", ".m", ".hpp", ".cpp", ".cc", ".tpp", ".swift")
          SHELL_NAMES = ("build", "size", "githelper")
          REWRITTEN = ("src/Tweak.mm", "src/NetLogger.mm", "Makefile", "README.md", ".gitignore")
          SHELL_TWEAK = "src/Tweak.mm"
          LOGGER = "src/NetLogger.mm"
          CONTRACT = (
              ("addBreakpointAtAddress:", "withHook:"),
              ("originalPointerForBreakpoint:",),
              ("suspendBreakpoints",),
              ("resumeBreakpoints",),
              ("breakpointSelfTest",),
              ("breakpointSlotLimit",),
              ("readMemoryAt:", "buffer:", "size:"),
          )
          FORBIDDEN_IN_SRC = (
              "task_set_exception_ports",
              "mach_excServer",
              "ARM_DEBUG_STATE64",
              "0x1e5",
              "DBGBVR",
              "mach_msg_server",
          )
          REQUIRED_IN_TWEAK = (
              "RVA_MESSAGEMANAGER_RECEIVEMESSAGE",
              "image_for_rva",
              "LC_SEGMENT_64",
              "VM_PROT_EXECUTE",
              "originalPointerForBreakpoint",
              "suspendBreakpoints",
              "resumeBreakpoints",
              "addBreakpointAtAddress",
          )
          LEGACY_PATHS = ("src/TitanoxImpl.mm", "Info.plist")
          STUBS = {
              'Foundation/Foundation.h': '#ifndef STUB_FOUNDATION_H\n#define STUB_FOUNDATION_H\n#include <stddef.h>\n#include <stdint.h>\n#include <stdbool.h>\n#include <stdarg.h>\n#include <dispatch/dispatch.h>\n\ntypedef unsigned long NSUInteger;\ntypedef long NSInteger;\ntypedef double NSTimeInterval;\ntypedef struct objc_object *id;\ntypedef signed char BOOL;\n#ifdef __cplusplus\n#define nil __null\n#else\n#define nil ((id)0)\n#endif\n#define YES ((BOOL)1)\n#define NO ((BOOL)0)\n\n@class NSString, NSMutableString, NSDictionary, NSError, NSTimer, NSNumber, NSArray, NSSet, NSData, NSBundle, NSFileManager;\n\n@protocol NSFastEnumeration\n- (NSUInteger)countByEnumeratingWithState:(void *)state objects:(id *)buf count:(NSUInteger)len;\n@end\n\n@interface NSObject\n+ (instancetype)alloc;\n+ (instancetype)new;\n+ (Class)class;\n- (instancetype)init;\n- (BOOL)isKindOfClass:(Class)cls;\n- (void)addAction:(id)action;\n@end\n\n@interface NSString : NSObject\n@property (readonly) const char *UTF8String;\n@property (readonly) NSString *lastPathComponent;\n+ (instancetype)string;\n+ (instancetype)stringWithFormat:(NSString *)format, ...;\n+ (instancetype)stringWithUTF8String:(const char *)cstr;\n- (NSString *)stringByAppendingPathComponent:(NSString *)component;\n- (BOOL)isEqualToString:(NSString *)other;\n@end\n\n@interface NSMutableString : NSString\n- (void)appendString:(NSString *)text;\n- (void)appendFormat:(NSString *)format, ...;\n@end\n\n@interface NSArray : NSObject <NSFastEnumeration>\n@end\n\n@interface NSSet : NSObject <NSFastEnumeration>\n@end\n\n@interface NSNumber : NSObject\n@end\n\n@interface NSDictionary : NSObject\n@end\n\n@interface NSError : NSObject\n@end\n\n@interface NSData : NSObject\n@end\n\n@interface NSTimer : NSObject\n+ (NSTimer *)scheduledTimerWithTimeInterval:(NSTimeInterval)interval\n                                    repeats:(BOOL)repeats\n                                      block:(void (^)(NSTimer *timer))block;\n@end\n\n@interface NSFileManager : NSObject\n+ (NSFileManager *)defaultManager;\n- (BOOL)createDirectoryAtPath:(NSString *)path\n  withIntermediateDirectories:(BOOL)create\n                   attributes:(NSDictionary *)attributes\n                        error:(NSError **)error;\n@end\n\n@interface NSBundle : NSObject\n+ (NSBundle *)mainBundle;\n@property (readonly) NSDictionary *infoDictionary;\n@property (readonly) NSString *bundlePath;\n@end\n\nNSString *NSHomeDirectory(void);\nvoid NSLog(NSString *format, ...);\n#endif\n',
