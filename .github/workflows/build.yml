name: Build Nulls-Titanox
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout tweak repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone Titanox repo
        run: |
          set -euo pipefail
          rm -rf libtitanox
          git clone --depth 1 https://github.com/flong69zxc-max/Titanox.git libtitanox
          rm -rf libtitanox/.git
          rm -rf libtitanox/.github
          ls -la libtitanox | head

      - name: Install Theos
        run: |
          set -euo pipefail
          export THEOS=$RUNNER_TEMP/theos
          if [ ! -d "$THEOS" ]; then
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          fi
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install ldid
        run: brew install ldid || true

      - name: Patch Makefile theos path
        run: |
          set -euo pipefail
          cd libtitanox
          grep -n "^theos" Makefile || true
          sed -i.bak "s|^theos[[:space:]]*=.*|theos = $THEOS|" Makefile
          grep -n "^theos" Makefile

      - name: Build libtitanox
        env:
          THEOS: ${{ env.THEOS }}
        run: |
          set -euo pipefail
          cd libtitanox
          chmod +x build || true
          ./build
          cd "$GITHUB_WORKSPACE"
          DYLIB=$(find libtitanox -name "libtitanox.dylib" -o -name "Titanox.dylib" 2>/dev/null | head -1)
          echo "dylib=$DYLIB"
          test -n "$DYLIB"
          file "$DYLIB"
          mkdir -p "$THEOS/lib"
          cp "$DYLIB" "$THEOS/lib/libtitanox.dylib"
          ls -la "$THEOS/lib/"

      - name: Build tweak
        env:
          THEOS: ${{ env.THEOS }}
        run: |
          set -euo pipefail
          make clean || true
          make -j4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nulls-titanox-build
          path: |
            packages/**
            **/*.deb
            .theos/obj/**/*.dylib
            libtitanox/*.deb
            libtitanox/packages/**
          retention-days: 30
          if-no-files-found: warn