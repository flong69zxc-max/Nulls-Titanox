name: Build Titanox

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: theos-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Install Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 --shallow-submodules \
            https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "$GITHUB_WORKSPACE/theos" > /tmp/theos-path

      - name: Restore Theos path
        if: steps.cache-theos.outputs.cache-hit == 'true'
        run: |
          echo "$GITHUB_WORKSPACE/theos" > /tmp/theos-path

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar
          key: brew-${{ runner.os }}-ldid-make

      - name: Install deps
        run: |
          set -euo pipefail
          brew install ldid make || true

      - name: Fetch Titanox
        run: |
          set -euo pipefail
          rm -rf deps/Titanox
          mkdir -p deps
          git clone --depth 1 https://github.com/flong69zxc-max/Titanox.git deps/Titanox
          rm -rf deps/Titanox/.git
          grep -n 'new\[\]' deps/Titanox/libtitanox/brk_hook/Hook/hook.h || echo "hook.h clean"

      - name: Configure env
        run: |
          set -euo pipefail
          THEOS_PATH=$(cat /tmp/theos-path)
          echo "THEOS=$THEOS_PATH" >> "$GITHUB_ENV"
          echo "$THEOS_PATH/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$PATH"
          gmake -j"$(sysctl -n hw.ncpu)" \
            ARCHS=arm64 \
            DEBUG=0 \
            FINALPACKAGE=1 \
            CC="clang -O2" \
            CXX="clang++ -O2" \
            ADDITIONAL_CFLAGS="-O2 -fno-exceptions" \
            ADDITIONAL_OBJCFLAGS="-O2"

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p out
          DYLIB=$(find .theos/obj -type f -name '*.dylib' ! -path '*.dSYM*' ! -path '*/debug/*' | head -n1)
          if [ -z "$DYLIB" ]; then
            DYLIB=$(find .theos/obj -type f -name '*.dylib' ! -path '*.dSYM*' | head -n1)
          fi
          if [ -z "$DYLIB" ]; then
            echo "no dylib produced"
            find .theos/obj -name '*.dylib'
            exit 1
          fi
          cp "$DYLIB" out/Titanox.dylib
          file out/Titanox.dylib
          otool -hv out/Titanox.dylib | head -n 5
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Titanox
          path: out/Titanox.dylib
          if-no-files-found: error