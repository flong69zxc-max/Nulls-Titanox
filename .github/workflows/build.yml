name: Build
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout tweak repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone Titanox
        run: |
          set -euo pipefail
          rm -rf libtitanox
          git clone --depth 1 https://github.com/flong69zxc-max/Titanox.git libtitanox
          rm -rf libtitanox/.git
          find libtitanox -maxdepth 3 -name Makefile

      - name: Install Theos
        run: |
          set -euo pipefail
          export THEOS=$RUNNER_TEMP/theos
          if [ ! -d "$THEOS" ]; then
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          fi
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install Theos SDKs
        run: |
          set -euo pipefail
          if [ ! -d "$THEOS/sdks" ] || [ -z "$(ls -A "$THEOS/sdks" 2>/dev/null)" ]; then
            rm -rf "$THEOS/sdks"
            git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          fi
          ls "$THEOS/sdks" | head -40

      - name: Install ldid
        run: brew install ldid || true

      - name: Patch duplicate segment name
        run: |
          set -euo pipefail
          find libtitanox -name "sih.hpp" -o -name "sih.mm" | while read f; do
            echo "checking $f"
            grep -n "HOOK_DATA_SEGMENT\|HOOK_TEXT_SEGMENT" "$f" || true
            sed -i.bak 's|HOOK_DATA_SEGMENT = "__TITANOX_HOOK"|HOOK_DATA_SEGMENT = "__TITANOX_DATA"|g' "$f"
            rm -f "$f.bak"
          done
          echo "--- after ---"
          grep -rn "HOOK_DATA_SEGMENT\|HOOK_TEXT_SEGMENT" libtitanox | head || true

      - name: Build libtitanox
        env:
          THEOS: ${{ env.THEOS }}
        run: |
          set -euo pipefail
          MK=$(find libtitanox -maxdepth 3 -name Makefile | head -1)
          DIR=$(dirname "$MK")
          echo "MK=$MK DIR=$DIR"
          sed -i.bak "s|/home/rage/theos|$THEOS|g" "$MK"
          cd "$DIR"
          make clean || true
          make -j4
          cd "$GITHUB_WORKSPACE"
          DYLIB=$(find libtitanox -name "libtitanox.dylib" -o -name "Titanox.dylib" 2>/dev/null | head -1)
          test -n "$DYLIB"
          file "$DYLIB"
          mkdir -p "$THEOS/lib"
          cp "$DYLIB" "$THEOS/lib/libtitanox.dylib"

      - name: Build tweak
        env:
          THEOS: ${{ env.THEOS }}
        run: |
          set -euo pipefail
          make clean || true
          make -j4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build
          path: |
            packages/**
            .theos/obj/**/*.dylib
            libtitanox/**/*.deb
          retention-days: 30
          if-no-files-found: warn