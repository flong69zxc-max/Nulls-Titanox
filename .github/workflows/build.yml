name: Build Titanox

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: theos
          key: ${{ runner.os }}-theos-v1

      - name: Setup Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        uses: Randomblock1/theos-action@v1

      - name: Clone Titanox
        run: |
          rm -rf deps
          mkdir -p deps
          git clone --depth 1 https://github.com/Ragekill3377/Titanox.git deps/Titanox

      - name: Build Titanox
        run: |
          cd deps/Titanox
          make -j$(sysctl -n hw.ncpu)

      - name: Create files
        run: |
          mkdir -p src
          if [ ! -f Makefile ]; then
            cat > Makefile <<'EOF'
TARGET = iphone:clang:latest:14.0
ARCHS = arm64 arm64e
INSTALL_TARGET_PROCESSES = Nulls Brawl

include $(THEOS)/makefiles/common.mk

TWEAK_NAME = Titanox
Titanox_FILES = src/Tweak.mm
Titanox_CFLAGS = -fobjc-arc -I$(THEOS_PROJECT_DIR)/deps/Titanox
Titanox_LDFLAGS = -L$(THEOS)/lib -ltitanox -Wl,-rpath,@executable_path

include $(THEOS_MAKE_PATH)/tweak.mk
EOF
          fi
          if [ ! -f control ]; then
            cat > control <<'EOF'
Package: com.nulls.titanox
Name: Titanox
Version: 1.0.0
Architecture: iphoneos-arm64
Description: Runtime hooks for Nulls Brawl
Maintainer: nulls
Author: nulls
Section: Tweaks
Depends: mobilesubstrate
EOF
          fi
          if [ ! -f Info.plist ]; then
            cat > Info.plist <<'EOF'
{
    Filter = {
        Bundles = ( "nt.nb.ios.app" );
    };
}
EOF
          fi
          if [ ! -f src/offsets.h ]; then
            cat > src/offsets.h <<'EOF'
#ifndef OFFSETS_H
#define OFFSETS_H

#define RVA_GETBOOL      0xb24820
#define RVA_ISDEV        0xd93d80
#define RVA_ISDEVBUILD   0xd93da0
#define RVA_DBGMENU_A    0x9b5afc
#define RVA_DBGMENU_B    0xbd736c

#endif
EOF
          fi
          if [ ! -f src/Tweak.mm ]; then
            cat > src/Tweak.mm <<'EOF'
#import <Foundation/Foundation.h>
#import "Titanox.h"
#include "offsets.h"

static bool (*orig_getBool)(void*);
static bool (*orig_isDev)(void*);
static bool (*orig_isDevBuild)(void*);

static bool hook_getBool(void* self) {
    return true;
}

static bool hook_isDev(void* self) {
    return true;
}

static bool hook_isDevBuild(void* self) {
    return true;
}

__attribute__((constructor))
static void init() {
    @autoreleasepool {
        StaticInlineHook *hooker = [[StaticInlineHook alloc] initWithMachOName:@"Nulls Brawl"];
        if (!hooker) return;
        uintptr_t base = [hooker getBaseAddress];
        if (!base) return;
        orig_getBool = (bool (*)(void*))[hooker hookFunctionAtVaddr:base + RVA_GETBOOL withReplacement:(void*)hook_getBool];
        orig_isDev = (bool (*)(void*))[hooker hookFunctionAtVaddr:base + RVA_ISDEV withReplacement:(void*)hook_isDev];
        orig_isDevBuild = (bool (*)(void*))[hooker hookFunctionAtVaddr:base + RVA_ISDEVBUILD withReplacement:(void*)hook_isDevBuild];
        NSLog(@"[Titanox] hooks installed base=%p", (void*)base);
    }
}
EOF
          fi

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Makefile control Info.plist src/offsets.h src/Tweak.mm
          git diff --cached --quiet || git commit -m "auto: add tweak source files"
          git push

      - name: Build Tweak
        run: |
          make clean || true
          make package

      - name: Install ldid
        uses: MOZGIII/install-ldid-action@v1
        with:
          ldid-version: v2.1.5-procursus7

      - name: Sign dylib
        run: |
          DYLIB=$(find .theos/obj -name "Titanox.dylib" | head -n1)
          test -n "$DYLIB"
          ldid -S "$DYLIB"
          file "$DYLIB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Titanox.dylib
          path: .theos/obj/**/Titanox.dylib
          if-no-files-found: error