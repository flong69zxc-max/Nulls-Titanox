name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      THEOS: ${{ github.workspace }}/.theos

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Setup Theos + Titanox
        run: |
          set -euo pipefail
          brew install ldid dpkg >/dev/null 2>&1 || brew install ldid >/dev/null 2>&1 || true

          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/lib"

          git clone --depth 1 https://github.com/flong69zxc-max/Titanox.git libtitanox
          rm -rf libtitanox/.git

      - name: Build libtitanox
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CXXINC=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/include/c++/v1

          find libtitanox \( -name 'sih.hpp' -o -name 'sih.mm' \) -exec \
            sed -i '' 's|"__TITANOX_HOOK"|"__TITANOX_DATA"|g' {} +

          MK=$(find libtitanox -maxdepth 3 -name Makefile | head -1)
          sed -i '' -e "s|/home/rage/theos|$THEOS|g" \
                    -e "s|^SYSROOT =.*|SYSROOT = $SDK|" \
                    -e "s|^ARCHS =.*|ARCHS = arm64 arm64e|" "$MK"
          printf '\nADDITIONAL_CFLAGS += -isystem %s\nADDITIONAL_CXXFLAGS += -isystem %s\n' "$CXXINC" "$CXXINC" >> "$MK"

          make -C "$(dirname "$MK")" -j$(sysctl -n hw.ncpu)

          DYLIB=$(find libtitanox \( -name 'libtitanox.dylib' -o -name 'Titanox.dylib' \) | head -1)
          test -n "$DYLIB"
          cp "$DYLIB" "$THEOS/lib/libtitanox.dylib"
          cp "$DYLIB" "$THEOS/lib/Titanox.dylib"

          mkdir -p "$THEOS/include/Titanox"
          (cd libtitanox && find . -name '*.h*' -exec sh -c \
            'mkdir -p "$THEOS/include/Titanox/$(dirname "${1#./}")"; cp "$1" "$THEOS/include/Titanox/${1#./}"' _ {} \;)

      - name: Build tweak
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CXXINC=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/include/c++/v1

          if [ -f Makefile ]; then
            sed -i '' "s|^SYSROOT =.*|SYSROOT = $SDK|" Makefile
            printf '\nADDITIONAL_CFLAGS += -isystem %s\nADDITIONAL_CXXFLAGS += -isystem %s\n' "$CXXINC" "$CXXINC" >> Makefile
          fi

          make -j$(sysctl -n hw.ncpu)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build
          path: |
            packages/**
            .theos/obj/**/*.dylib
            libtitanox/**/*.deb
          retention-days: 30
          if-no-files-found: warn