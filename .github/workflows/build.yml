name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      THEOS: ${{ github.workspace }}/.theos

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Setup + patch
        run: |
          set -euo pipefail
          brew install ldid dpkg >/dev/null 2>&1 || true
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/lib" "$THEOS/include/Titanox" deps

          git clone --depth 1 https://github.com/flong69zxc-max/Titanox.git deps/Titanox
          rm -rf deps/Titanox/.git

          find deps/Titanox \( -name 'sih.hpp' -o -name 'sih.mm' \) -exec \
            sed -i '' 's|"__TITANOX_HOOK"|"__TITANOX_DATA"|g' {} +
          find deps/Titanox -name 'hook.c' -exec \
            sed -i '' 's|arm_thread_state64_set_pc_fptr(\*new, hooks\[i\].new)|arm_thread_state64_set_pc_fptr(*new, (void *)hooks[i].new)|g' {} +

      - name: Build libtitanox
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CXXINC=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/include/c++/v1

          MK=$(find deps/Titanox -maxdepth 4 -name Makefile | head -1)
          sed -i '' -e "s|/home/rage/theos|$THEOS|g" \
                    -e "s|^SYSROOT =.*|SYSROOT = $SDK|" "$MK"
          printf '\nADDITIONAL_CFLAGS += -isystem %s\nADDITIONAL_CXXFLAGS += -isystem %s\n' "$CXXINC" "$CXXINC" >> "$MK"

          make -C "$(dirname "$MK")" -j$(sysctl -n hw.ncpu)

          DYLIB=$(find deps/Titanox \( -name 'libtitanox.dylib' -o -name 'Titanox.dylib' \) | head -1)
          test -n "$DYLIB"
          cp "$DYLIB" "$THEOS/lib/libtitanox.dylib"
          cp "$DYLIB" "$THEOS/lib/Titanox.dylib"

          (cd deps/Titanox && find . -name '*.h*' -exec sh -c \
            'd="$THEOS/include/Titanox/$(dirname "${1#./}")"; mkdir -p "$d"; cp "$1" "$d/"' _ {} \;)
          find deps/Titanox -name 'libtitanox.h' -exec cp {} "$THEOS/include/Titanox/" \;

      - name: Build tweak
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CXXINC=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/include/c++/v1
          EXTRA="-isystem $CXXINC -I$THEOS/include -I$THEOS/include/Titanox -Ideps/Titanox/include -Ideps/Titanox/libtitanox -Ideps/Titanox"

          sed -i '' "s|^SYSROOT =.*|SYSROOT = $SDK|" Makefile
          printf '\nADDITIONAL_CFLAGS += %s\nADDITIONAL_CXXFLAGS += %s\n' "$EXTRA" "$EXTRA" >> Makefile

          make -j$(sysctl -n hw.ncpu)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build
          path: |
            packages/**
            .theos/obj/**/*.dylib
            deps/Titanox/**/*.deb
          retention-days: 30
          if-no-files-found: warn