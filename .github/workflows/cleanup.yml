name: cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          set -euo pipefail
          brew list ldid >/dev/null 2>&1 || brew install ldid
          brew list make >/dev/null 2>&1 || brew install make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: theos
          key: theos-${{ runner.os }}-cleanup-v1

      - name: Setup Theos
        run: |
          set -euo pipefail
          if [ ! -d theos/.git ]; then
            git clone --recursive --depth 1 --shallow-submodules \
              https://github.com/theos/theos.git theos
          fi
          git -C theos submodule update --init --recursive
          echo "THEOS=$PWD/theos" >> "$GITHUB_ENV"
          echo "$PWD/theos/bin" >> "$GITHUB_PATH"

      - name: Get Titanox
        run: |
          set -euo pipefail
          mkdir -p deps
          git clone --depth 1 https://github.com/flong69zxc-max/Titanox.git deps/Titanox
          git -C deps/Titanox rev-parse HEAD

      - name: Check the shape of the tree
        run: |
          set -euo pipefail
          test -f src/titanox.h
          test ! -f src/Titanox.mm
          test -f src/core/offsets.h
          test -f src/core/memory.mm
          grep -q -- '-Isrc' Makefile || echo "warning: -Isrc is not in the Makefile, the build below will say so"
          grep -q 'src/core/memory.mm' Makefile || echo "warning: the Makefile does not name src/core/memory.mm"
          echo "the tree is the split one and the offsets live in one file"

      - name: Write the cleaner
        run: |
          set -euo pipefail
          cat > /tmp/tnx_clean.py <<'PYC'
          import os
          import re
          import sys
          from collections import Counter

          ROOT = os.environ.get('CLEAN_ROOT', '.')
          DEVERSION = os.environ.get('CLEAN_DEVERSION', '1') == '1'
          DEAD = os.environ.get('CLEAN_DEAD', '1') == '1'
          README_FIX = os.environ.get('CLEAN_README', '1') == '1'
          TAG = os.environ.get('CLEAN_TAG', 'Titanox')

          EXTERNAL = (
              'src/core/offsets.h',
              'src/offsets.h',
              'src/lc_detect.h',
              'src/resolve_targets.mm',
          )

          TEST_FLAGS = ('TNX_V98_CLIP_SELFTEST',)

          PUBLIC = ('start', 'main', 'setup')

          VERSIONED = re.compile(r'\b(TNX_V|tnx_v|g_v)(\d+)_([A-Za-z]\w*)\b')
          WORD = re.compile(r'[A-Za-z_]\w*')
          LOG_TAG = re.compile(r'("(?:\s*=== )?)v\d{1,3} ')


          def mask(text):
              out = list(text)
              i = 0
              n = len(text)
              while i < n:
                  c = text[i]
                  if c == '"' or c == "'":
                      q = c
                      j = i + 1
                      while j < n:
                          if text[j] == '\\':
                              j += 2
                              continue
                          if text[j] == q:
                              break
                          j += 1
                      for k in range(i, min(j + 1, n)):
                          if out[k] != '\n':
                              out[k] = ' '
                      i = j + 1
                      continue
                  i += 1
              return ''.join(out)


          def find_match(t, i, o, c):
              d = 0
              while i < len(t):
                  if t[i] == o:
                      d += 1
                  elif t[i] == c:
                      d -= 1
                      if d == 0:
                          return i
                  i += 1
              return -1


          def cut(text, a, b):
              ls = text.rfind('\n', 0, a) + 1
              le = text.find('\n', b)
              if le < 0:
                  le = len(text)
              if text[ls:a].strip() == '' and text[b:le].strip() == '':
                  a = ls
                  b = le + 1
              return text[:a] + text[b:]


          def statement_end(t, k):
              while k < len(t) and t[k] in ' \t\r\n':
                  k += 1
              if k < len(t) and t[k] == '{':
                  e = find_match(t, k, '{', '}')
                  return e + 1 if e >= 0 else -1
              d = 0
              while k < len(t):
                  ch = t[k]
                  if ch in '([{':
                      d += 1
                  elif ch in ')]}':
                      d -= 1
                  elif ch == ';' and d == 0:
                      return k + 1
                  k += 1
              return -1


          def depth0_or(cond):
              d = 0
              i = 0
              while i < len(cond):
                  ch = cond[i]
                  if ch == '(':
                      d += 1
                  elif ch == ')':
                      d -= 1
                  elif ch == '|' and d == 0 and cond.startswith('||', i):
                      return True
                  i += 1
              return False


          def forces_false(cond, flag):
              words = re.compile(r'\b' + re.escape(flag) + r'\b')
              d = 0
              i = 0
              pos = None
              while i < len(cond):
                  ch = cond[i]
                  if ch == '(':
                      d += 1
                      i += 1
                      continue
                  if ch == ')':
                      d -= 1
                      i += 1
                      continue
                  if d == 0:
                      m = words.match(cond, i)
                      if m:
                          pos = i
                          break
                  i += 1
              if pos is None:
                  return False
              if depth0_or(cond):
                  return False
              pre = cond[:pos].rstrip()
              if pre == '':
                  return True
              return pre.endswith('&&')


          def defines_of(text):
              out = {}
              for m in re.finditer(r'^[ \t]*#define[ \t]+(\w+)[ \t]+(.*?)[ \t]*$', mask(text), re.M):
                  out.setdefault(m.group(1), []).append(m.group(2).strip())
              return out


          def zero_flags(texts):
              counts = {}
              for text in texts.values():
                  for name, vals in defines_of(text).items():
                      counts.setdefault(name, []).extend(vals)
              return set(n for n, v in counts.items() if len(v) == 1 and re.fullmatch(r'0[ULul]*', v[0]))


          def fold_flags(path, text, zeros, named):
              hits = []
              i = 0
              t = mask(text)
              while True:
                  m = re.search(r'(?<![\w.])if\s*\(', t[i:])
                  if not m:
                      break
                  start = i + m.start()
                  par = i + m.end() - 1
                  i = start + 2
                  if re.search(r'else\s*$', t[:start]):
                      continue
                  close = find_match(t, par, '(', ')')
                  if close < 0:
                      continue
                  cond = t[par + 1:close]
                  flag = None
                  for name in named:
                      if re.search(r'\b' + re.escape(name) + r'\b', cond):
                          flag = name
                          break
                  if flag is None:
                      for name in zeros:
                          if re.search(r'\b' + re.escape(name) + r'\b', cond) and forces_false(cond, name):
                              flag = name
                              break
                  if flag is None:
                      continue
                  if flag not in named and not forces_false(cond, flag):
                      continue
                  end = statement_end(t, close + 1)
                  if end < 0:
                      continue
                  if re.match(r'\s*else\b', t[end:]):
                      continue
                  hits.append((start, end, flag, ' '.join(cond.split())[:70]))
                  text = cut(text, start, end)
                  t = mask(text)
                  i = 0
              return text, hits


          def function_bodies(text):
              out = []
              t = mask(text)
              for m in re.finditer(r'\b(\w+)\s*\(', t):
                  par = m.end() - 1
                  name = m.group(1)
                  close = find_match(t, par, '(', ')')
                  if close < 0:
                      continue
                  k = close + 1
                  while k < len(t) and t[k] in ' \t\r\n':
                      k += 1
                  if k < len(t) and t[k] == '{':
                      end = find_match(t, k, '{', '}')
                      if end < 0:
                          continue
                      head = t[max(0, m.start() - 120):m.start()]
                      out.append((name, m.start(), k, end, head))
              return out


          def top_eq(text):
              d = 0
              for ch in text:
                  if ch in '([':
                      d += 1
                  elif ch in ')]':
                      d -= 1
                  elif ch == '=' and d == 0:
                      return True
              return False


          def scan_body(lines, start):
              total = len(lines)
              j = start
              depth = 0
              seen = False
              while j < total:
                  clean = mask(lines[j])
                  depth += clean.count('{') - clean.count('}')
                  if '{' in clean:
                      seen = True
                  stripped = lines[j].rstrip()
                  if depth == 0:
                      if not seen and stripped.endswith(';'):
                          return j
                      if seen and stripped.endswith(';'):
                          return j
                      if seen and stripped.endswith('}'):
                          if j + 1 < total and lines[j + 1].strip() == ';':
                              return j + 1
                          return j
                  j += 1
              return total - 1


          def parse_blocks(lines):
              out = []
              i = 0
              while i < len(lines):
                  s = lines[i].rstrip()
                  if s.startswith('#define'):
                      j = i
                      while j < len(lines) and lines[j].rstrip().endswith('\\'):
                          j += 1
                      out.append(('define', i, j))
                      i = j + 1
                      continue
                  if s.startswith(('typedef', 'struct ', 'union ', 'enum ')):
                      j = scan_body(lines, i)
                      out.append(('type', i, j))
                      i = j + 1
                      continue
                  if s.startswith(('#if', '#include', '#import')):
                      out.append(('other', i, i))
                      i += 1
                      continue
                  if not s.strip():
                      out.append(('other', i, i))
                      i += 1
                      continue
                  j = scan_body(lines, i)
                  text = '\n'.join(lines[i:j + 1])
                  rolled = mask(text)
                  is_decl = re.match(r'\s*extern\b', text) and '{' not in rolled
                  if '{' in rolled and not is_decl:
                      head = rolled[:rolled.index('{')].rstrip()
                      kind = 'func' if head.endswith(')') else 'global'
                  else:
                      body = rolled.rstrip().rstrip(';').rstrip()
                      kind = 'decl' if (is_decl or (not top_eq(rolled) and body.endswith(')'))) else 'global'
                  out.append((kind, i, j))
                  i = j + 1
              return out


          def names_of(kind, text):
              t = mask(text)
              if kind == 'define':
                  m = re.match(r'\s*#define\s+(\w+)', t)
                  return [m.group(1)] if m else []
              if kind == 'func':
                  head = t[:t.index('{')] if '{' in t else t
                  while '__attribute__' in head:
                      a = head.index('__attribute__')
                      par = head.find('(', a)
                      if par < 0:
                          head = head[:a]
                          break
                      close = find_match(head, par, '(', ')')
                      head = head[:a] + ' ' + (head[close + 1:] if close >= 0 else '')
                  m = re.search(r'\b(\w+)\s*\(', head)
                  return [m.group(1)] if m else []
              if kind in ('global', 'decl'):
                  left = t.split('=')[0]
                  left = re.sub(r'\([^()]*\)\s*;\s*$', ' ;', left)
                  left = re.sub(r'\[[^\]]*\]', ' ', left)
                  ids = re.findall(r'\b(\w+)\b', left)
                  return ids[-1:]
              return []


          DECL = re.compile(
              r'\s*(?:const\s+)?(?:unsigned\s+|signed\s+)?'
              r'(?:int|long|short|char|float|double|bool|BOOL|size_t|ssize_t|int8_t|int16_t|int32_t|'
              r'int64_t|uint8_t|uint16_t|uint32_t|uint64_t|uintptr_t|intptr_t|void)\s*\**\s*\w+')

          PURE = ('sqrtf', 'cosf', 'sinf', 'fabsf', 'floorf', 'ceilf', 'roundf', 'fminf', 'fmaxf',
                  'hypotf', 'atan2f', 'powf', 'sqrt', 'cos', 'sin', 'fabs')


          def pre_ok(pre):
              for st in pre.split(';'):
                  st = st.strip()
                  if not st:
                      continue
                  if not DECL.match(st):
                      return False
                  if re.search(r'\b(?:g_|tnx_)\w+\b', st):
                      return False
                  if re.search(r'->|\+\+|--|\+=|-=|\*=|/=|&=|\|=', st):
                      return False
                  for call in re.findall(r'\b(\w+)\s*\(', st):
                      if call not in PURE:
                          return False
              return True


          def stubs(text, zeros):
              out = []
              t = mask(text)
              for name, mstart, brace, end, head in function_bodies(text):
                  m = re.search(r'if \(!([A-Za-z_]\w*)\) return', t[brace + 1:end])
                  if not m or m.group(1) not in zeros:
                      continue
                  k = brace + 1 + m.start()
                  par = t.find('(', k)
                  close = find_match(t, par, '(', ')')
                  if close < 0:
                      continue
                  if not pre_ok(t[brace + 1:k]):
                      continue
                  s = statement_end(t, close + 1)
                  if s < 0 or not t[close + 1:s].strip().startswith('return'):
                      continue
                  out.append((name, m.group(1)))
              return out


          def line_of(text, pos):
              return text.count('\n', 0, pos)


          def remove_lines(per):
              for path, drop in per.items():
                  lines = open(path).read().split('\n')
                  kept = [l for n, l in enumerate(lines) if n not in drop]
                  open(path, 'w').write('\n'.join(kept))


          def span_chars(files, defs, decls, name):
              spans = {}
              for p, i, j, k in defs.get(name, []):
                  spans.setdefault(p, []).append((i, j + 1))
              for p, i, j in decls.get(name, []):
                  spans.setdefault(p, []).append((i, j + 1))
              out = {}
              for p, pairs in spans.items():
                  body = open(p).read().split('\n')
                  starts = []
                  pos = 0
                  for line in body:
                      starts.append(pos)
                      pos += len(line) + 1
                  out[p] = [(starts[a], starts[b - 1] + len(body[b - 1])) for a, b in pairs]
              return out


          def drop_symbol(defs, decls, files, name, sites):
              per = {}
              for p, i, j, k in defs.get(name, []):
                  per.setdefault(p, set()).update(range(i, j + 1))
              for p, i, j in decls.get(name, []):
                  per.setdefault(p, set()).update(range(i, j + 1))
              for p, a, b in sites:
                  text = open(p).read()
                  per.setdefault(p, set()).update(range(line_of(text, a), line_of(text, b - 1) + 1))
              remove_lines(per)


          def calls_of(files, name, ranges):
              pat = re.compile(r'\b' + re.escape(name) + r'\b')
              sites = []
              for path in files:
                  t = mask(open(path).read())
                  for m in pat.finditer(t):
                      pos = m.start()
                      if any(a <= pos < b for a, b in ranges.get(path, [])):
                          continue
                      ls = t.rfind('\n', 0, pos) + 1
                      if t[ls:pos].strip():
                          return None
                      e = statement_end(t, pos)
                      if e < 0:
                          return None
                      le = t.find('\n', e)
                      if le < 0:
                          le = len(t)
                      if t[e:le].strip():
                          return None
                      sites.append((path, ls, le + 1))
              return sites


          def drop_lines(files, sites):
              order = {}
              for path, a, b in sites:
                  order.setdefault(path, []).append((a, b))
              for path, spans in order.items():
                  lines = open(path).read().split('\n')
                  starts = []
                  pos = 0
                  for n, line in enumerate(lines):
                      starts.append(pos)
                      pos += len(line) + 1
                  drop = set()
                  for a, b in spans:
                      for n, s in enumerate(starts):
                          if a <= s < b:
                              drop.add(n)
                  kept = [l for n, l in enumerate(lines) if n not in drop]
                  open(path, 'w').write('\n'.join(kept))


          def tree(root):
              files = []
              for base, dirs, names in os.walk(os.path.join(root, 'src')):
                  for name in sorted(names):
                      if name.endswith('.h') or name.endswith('.mm'):
                          files.append(os.path.join(base, name))
              return sorted(files)


          def index(files):
              defs = {}
              decls = {}
              for path in files:
                  lines = open(path).read().split('\n')
                  if lines and lines[-1] == '':
                      lines = lines[:-1]
                  bl = parse_blocks(lines)
                  for kind, i, j in bl:
                      body = '\n'.join(lines[i:j + 1])
                      for name in names_of(kind, body):
                          if kind in ('func', 'global', 'define'):
                              defs.setdefault(name, []).append((path, i, j, kind))
                          elif kind == 'decl':
                              decls.setdefault(name, []).append((path, i, j))
              return defs, decls


          def referenced(whole, name):
              return len(re.findall(r'\b' + re.escape(name) + r'\b', whole))


          def purge(dead, decls, files):
              for path in files:
                  text = open(path).read()
                  lines = text.split('\n')
                  drop = set()
                  for name, where in dead.items():
                      for p, i, j, kind in where:
                          if p == path:
                              drop.update(range(i, j + 1))
                      for p, i, j in decls.get(name, []):
                          if p == path:
                              drop.update(range(i, j + 1))
                  if drop:
                      kept = [l for n, l in enumerate(lines) if n not in drop]
                      open(path, 'w').write('\n'.join(kept))


          def deversion(files):
              originals = set()
              for path in files:
                  originals.update(m.group(0) for m in VERSIONED.finditer(open(path).read()))
              if not originals:
                  return {}
              taken = set()
              for path in files:
                  taken.update(re.findall(r'\b[A-Za-z_]\w*\b', VERSIONED.sub(' ', open(path).read())))
              taken -= originals
              mapping = {}
              used = set()
              for name in sorted(originals):
                  if name.startswith('TNX_V'):
                      head = 'TNX_'
                  elif name.startswith('tnx_v'):
                      head = 'tnx_'
                  else:
                      head = 'g_'
                  want = name
                  while True:
                      m = VERSIONED.match(want)
                      if not m:
                          break
                      want = head + m.group(3)
                  keep = want
                  n = 2
                  while keep in taken or keep in used:
                      keep = '%s_%d' % (want, n)
                      n += 1
                  used.add(keep)
                  mapping[name] = keep
              pattern = re.compile(r'\b(' + '|'.join(re.escape(k) for k in sorted(mapping, key=len, reverse=True)) + r')\b')
              for path in files:
                  text = open(path).read()
                  text = pattern.sub(lambda m: mapping[m.group(1)], text)
                  text = LOG_TAG.sub(lambda m: m.group(1), text)
                  text = re.sub(r'#define TNX_BUILD_TAG "[^"]*"', '#define TNX_BUILD_TAG "%s"' % TAG, text)
                  open(path, 'w').write(text)
              return mapping


          README = '''# Titanox

          A tweak for Nulls Brawl on iOS. It reads the battle state, walks the character
          out of incoming fire and writes down what it did.

          It is built against one specific Nulls Brawl arm64 build. The addresses in
          src/core/offsets.h belong to that build, so a game update breaks the tweak and
          that one file has to be redone.

          ## Layout

              src/titanox.h          the master header: config, types, then one header per module
              src/core/imports.h     frameworks and project imports
              src/core/config.h      the build tag and every constant that is not an address
              src/core/offsets.h     every address and structure offset, in one table
              src/core/types.h       every typedef and struct
              src/core/memory.mm     image bounds, the safe readers and writers, the write guard
              src/core/log.mm        the log handle, the line filter, the slot and object reports
              src/core/crash.mm      the phase stages and the signal handler
              src/core/hooks.mm      image load, the hook slots, the objc scrape, the entry points
              src/utils/strings.mm   ascii and word helpers
              src/utils/geometry.mm  floats, clamps, coordinate bounds
              src/helpers/scan.mm    containers, the census, the roster, the projectile scan
              src/helpers/move.mm    the controller, the stick and drag writers, the prediction call
              src/features/autododge.mm  threat build, direction choice, engage and release
              src/features/walls.mm  the tile grid and the wall clip
              src/features/report.mm the stats line

          Every module includes src/titanox.h. A module header includes src/core/types.h
          only, so there is no include cycle. Nothing is static: a symbol used across
          modules is declared in the header of the module that defines it.

          ## Build

              make package
              make install

          theos and the iOS sdk are the only requirements. arm64 only.

          ## Log

          On device the log is at /var/mobile/Documents/Titanox.log. Every line names the
          subsystem it came from, so a change can be read back with a grep:

              grep 'dodge ' Titanox.log

          The lines worth knowing:

              drag     what the stick was told to do, and whether the engine kept it
              dodge    health before and after a threat, and whether the dodge was moving
              grid     the tile map as the engine sees it, with a mask around the player
              state    one line per tick with every counter

          ## Notes

          The dodge reads the same tile map the game reads and drives the game's own touch
          drag instead of poking a movement field, so the movement it asks for is the kind
          the engine already knows how to follow. It does not aim and it does not shoot.

          Writes go through a guard that refuses an address the process cannot write to,
          and every write is kept in a small ring. If the game does abort anyway, the
          [CRASH] line in the log is followed by the last writes with their address, size
          and the phase they happened in, which is usually enough to name the culprit.
          '''


          def main():
              files = tree(ROOT)
              modules = [p for p in files if os.path.relpath(p, ROOT) not in EXTERNAL]
              module_set = set(modules)
              if not modules:
                  print('no modules under %s/src' % ROOT)
                  return 1
              print('files: %d, modules: %d' % (len(files), len(modules)))

              if DEAD:
                  zeros = zero_flags({p: open(p).read() for p in files})
                  print('flags with a literal zero:', len(zeros))

                  for flag in TEST_FLAGS:
                      for path in modules:
                          text = open(path).read()
                          text, hits = fold_flags(path, text, (), (flag,))
                          if hits:
                              open(path, 'w').write(text)
                              for _, _, f, cond in hits:
                                  print('  self test %s dropped from %s: %s'
                                        % (f, os.path.relpath(path, ROOT), cond))
                              if flag in zeros:
                                  zeros.discard(flag)

                  for sweep in range(12):
                      zeros = zero_flags({p: open(p).read() for p in files})
                      folded = 0
                      for path in modules:
                          text = open(path).read()
                          text, hits = fold_flags(path, text, zeros, ())
                          if hits:
                              open(path, 'w').write(text)
                              folded += len(hits)
                              for _, _, f, cond in hits:
                                  print('  unreachable, flag %s in %s: %s' % (f, path, cond))
                      dropped = 0
                      skipped = set()
                      while True:
                          defs, decls = index(files)
                          pick = None
                          for path in modules:
                              for name, flag in stubs(open(path).read(), zeros):
                                  if name in skipped:
                                      continue
                                  if name in defs and all(p in module_set for p, i, j, k in defs[name]):
                                      pick = (name, flag)
                                      break
                                  skipped.add(name)
                                  print('  no-op %s has no module definition, left alone' % name)
                              if pick:
                                  break
                          if not pick:
                              break
                          name, flag = pick
                          sites = calls_of(files, name, span_chars(files, defs, decls, name))
                          if sites is None:
                              skipped.add(name)
                              print('  no-op %s is used in place, left alone' % name)
                              continue
                          drop_symbol(defs, decls, files, name, sites)
                          dropped += 1
                          print('  no-op %s dropped, flag %s' % (name, flag))
                      print('sweep %d: unreachable statements removed: %d, no-op functions removed: %d'
                            % (sweep + 1, folded, dropped))

                      defs, decls = index(files)
                      whole = Counter(WORD.findall('\n'.join(open(p).read() for p in files)))
                      declared = Counter(WORD.findall('\n'.join(
                          '\n'.join(open(p).read().split('\n')[i:j + 1])
                          for p in files
                          for kind, i, j in parse_blocks(open(p).read().split('\n'))
                          if kind == 'decl')))
                      dead = {}
                      for name, where in defs.items():
                          if name in PUBLIC:
                              continue
                          if not all(p in module_set for p, i, j, k in where):
                              continue
                          if any('constructor' in '\n'.join(open(p).read().split('\n')[i:j + 1]) or
                                 'destructor' in '\n'.join(open(p).read().split('\n')[i:j + 1])
                                 for p, i, j, k in where):
                              continue
                          own = 0
                          for p, i, j, k in where:
                              own += referenced('\n'.join(open(p).read().split('\n')[i:j + 1]), name)
                          live = whole[name] - declared[name] - own
                          if live <= 0:
                              dead[name] = where
                      if not dead:
                          print('sweep %d: no unreferenced symbol left' % (sweep + 1))
                          break
                      print('sweep %d: unreferenced symbols removed: %d %s'
                            % (sweep + 1, len(dead), sorted(dead)[:10]))
                      purge(dead, decls, files)

              for path in modules:
                  lines = open(path).read().split('\n')
                  kept = []
                  blank = 0
                  for line in lines:
                      if line == '':
                          blank += 1
                          if blank > 1:
                              continue
                      else:
                          blank = 0
                      kept.append(line)
                  open(path, 'w').write('\n'.join(kept))

              if DEVERSION:
                  mapping = deversion(files)
                  print('identifiers de-versioned:', len(mapping))

              if README_FIX and os.path.exists(os.path.join(ROOT, 'README.md')):
                  open(os.path.join(ROOT, 'README.md'), 'w').write(README)
                  print('README.md rewritten')

              for path in files:
                  text = open(path).read()
                  if not text.endswith('\n'):
                      open(path, 'w').write(text + '\n')

              left = {}
              dangling = {}
              unbalanced = {}
              defined = set()
              for path in files:
                  lines = open(path).read().split('\n')
                  for kind, i, j in parse_blocks(lines):
                      for name in names_of(kind, '\n'.join(lines[i:j + 1])):
                          defined.add(name)
              headers = set()
              for path in files:
                  if path.endswith('.h'):
                      headers.update(re.findall(r'\b(g_\w+|tnx_\w+)\b', mask(open(path).read())))
              known = defined | headers

              for path in files:
                  text = open(path).read()
                  for m in VERSIONED.finditer(text):
                      left.setdefault(m.group(0), []).append(path)
                  depth = 0
                  for line in text.split('\n'):
                      clean = mask(line)
                      depth += clean.count('{') - clean.count('}')
                  if depth != 0:
                      unbalanced[path] = depth
                  for n, line in enumerate(text.split('\n'), 1):
                      for m in re.finditer(r'\b(g_\w+|tnx_\w+)\b', mask(line)):
                          if m.group(1) not in known:
                              dangling.setdefault(m.group(1), []).append('%s:%d' % (path, n))

              print('version tagged identifiers left :', len(left), sorted(left)[:6])
              print('unbalanced files                :', len(unbalanced), sorted(unbalanced)[:4])
              print('references with no definition   :', len(dangling), sorted(dangling)[:6])
              bad = len(left) + len(unbalanced) + len(dangling)
              print('gates:', 'PASS' if bad == 0 else 'FAIL')
              return 1 if bad else 0


          if __name__ == '__main__':
              sys.exit(main())
          PYC
          python3 -c "import ast; ast.parse(open('/tmp/tnx_clean.py').read())"
          echo "the cleaner parses, $(wc -l < /tmp/tnx_clean.py) lines"

      - name: Strip the versions and the dead code
        run: |
          set -euo pipefail
          files() { find src -type f \( -name '*.mm' -o -name '*.h' \) | sort; }
          before_lines=$(cat $(files) | wc -l)
          before_tags=$(grep -rhoE '\b(TNX_V|tnx_v|g_v)[0-9]+_[A-Za-z_]' src | wc -l)
          before_dead=$(grep -rc '^#define' src/core/config.h)
          echo "before: $(files | wc -l) files, $before_lines lines, $before_tags version tagged references"
          CLEAN_ROOT=. \
          CLEAN_DEVERSION=1 \
          CLEAN_DEAD=1 \
          CLEAN_README=1 \
          CLEAN_TAG=Titanox \
            python3 /tmp/tnx_clean.py
          after_lines=$(cat $(files) | wc -l)
          after_tags=$(grep -rhoE '\b(TNX_V|tnx_v|g_v)[0-9]+_[A-Za-z_]' src | wc -l)
          after_dead=$(grep -rc '^#define' src/core/config.h)
          echo "after : $after_lines lines, $after_tags version tagged references"
          echo "config.h: $before_dead defines -> $after_dead defines"
          echo "$((before_lines - after_lines)) lines gone"
          test -f README.md
          grep -q 'src/core/offsets.h' README.md

      - name: Build the cleaned tree
        run: |
          set -euo pipefail
          gmake clean
          gmake -j"$(sysctl -n hw.ncpu)" ARCHS=arm64 DEBUG=0 FINALPACKAGE=1
          dylib="$(find .theos -type f -name Titanox.dylib ! -path '*.dSYM/*' | sort | head -n 1)"
          test -n "$dylib"
          test -s "$dylib"
          cp "$dylib" /tmp/Titanox.dylib
          xcrun lipo -info /tmp/Titanox.dylib
          shasum -a 256 /tmp/Titanox.dylib
          echo "the cleaned tree builds and the dylib is not empty"

      - name: Commit the cleanup
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "the tree was already clean, nothing to commit"
            exit 0
          fi
          git status --short
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -q -m "strip the test versions and the dead code"
          git push
          echo "the cleanup is pushed"
