name: offsets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          brew list ldid >/dev/null 2>&1 || brew install ldid
          brew list make >/dev/null 2>&1 || brew install make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: theos
          key: theos-${{ runner.os }}-offsets-v1

      - name: Setup Theos
        run: |
          set -euo pipefail
          if [ ! -d theos/.git ]; then
            git clone --recursive --depth 1 --shallow-submodules \
              https://github.com/theos/theos.git theos
          fi
          git -C theos submodule update --init --recursive
          echo "THEOS=$PWD/theos" >> "$GITHUB_ENV"
          echo "$PWD/theos/bin" >> "$GITHUB_PATH"

      - name: Get Titanox
        run: |
          set -euo pipefail
          mkdir -p deps
          git clone --depth 1 https://github.com/flong69zxc-max/Titanox.git deps/Titanox
          git -C deps/Titanox rev-parse HEAD

      - name: Build before the move
        run: |
          set -euo pipefail
          echo "this build is the baseline, the move is only measured against a tree that already builds"
          gmake clean
          gmake -j"$(sysctl -n hw.ncpu)" ARCHS=arm64 DEBUG=0 FINALPACKAGE=1
          echo "baseline build is green"

      - name: Move every address into core/offsets.h
        run: |
          set -euo pipefail
          cat > /tmp/move.py <<'MV'
          import os
          import re
          import sys

          CONFIG = os.environ.get('MOVE_CONFIG', 'src/core/config.h')
          OFFSETS = os.environ.get('MOVE_OFFSETS', 'src/core/offsets.h')
          LEGACY = os.environ.get('MOVE_LEGACY', 'src/offsets.h')
          IMPORTS = os.environ.get('MOVE_IMPORTS', 'src/core/imports.h')
          TARGETS = os.environ.get('MOVE_TARGETS', 'src/resolve_targets.mm')

          KEEP_SUFFIX = ('_SPAN', '_MAX', '_MIN', '_SIZE', '_BYTES', '_BUF', '_COUNT', '_MASK', '_QWORDS',
                         '_DUMPS', '_BASES', '_FLOATS', '_NAMES', '_SLOTS', '_ENTRIES', '_SEGS', '_LINE',
                         '_TEXT', '_MAG', '_SCALE', '_EPS', '_ALIGN', '_SPEED', '_MS', '_PCT', '_BODY',
                         '_STEP', '_HOLD', '_TTL', '_RATIO', '_DOT', '_BAND', '_GRACE', '_AWARE', '_REACH',
                         '_SKIN', '_PROBE', '_HORIZON', '_MOMENTUM', '_ENGAGE', '_LAG', '_RADIUS',
                         '_MARGIN', '_PERIOD', '_TTICKS', '_TICKS', '_LOGS', '_LINES', '_PROOF', '_SIGHT')

          KEEP_PREFIX = ()


          def blocks(lines):
              out = []
              i = 0
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('#define'):
                      j = i
                      while j < len(lines) and lines[j].rstrip().endswith('\\'):
                          j += 1
                      out.append((True, i, j, lines[i:j + 1]))
                      i = j + 1
                      continue
                  out.append((False, i, i, [line]))
                  i += 1
              return out


          def name_value(text):
              m = re.match(r'#define\s+(\w+)\s*(.*)$', text, re.S)
              if not m:
                  return None, None
              return m.group(1), m.group(2).strip()


          def is_address(name, value):
              if name.startswith(KEEP_PREFIX):
                  return False
              if name.endswith(KEEP_SUFFIX):
                  return False
              if name.startswith('TNX_RVA_') or name.endswith('_RVA'):
                  return True
              if name.endswith('_OFF'):
                  return True
              hexes = re.findall(r'0x([0-9a-fA-F]+)', value)
              for h in hexes:
                  if len(h) >= 5:
                      return True
              return False


          def main():
              src = open(CONFIG).read().split('\n')
              trailing = src and src[-1] == ''
              if trailing:
                  src = src[:-1]
              parsed = blocks(src)
              before = {}
              for is_def, i, j, body in parsed:
                  if not is_def:
                      continue
                  name, value = name_value('\n'.join(body))
                  if name:
                      before[name] = value

              moved = [(i, j, body) for is_def, i, j, body in parsed
                       if is_def and is_address(*(name_value('\n'.join(body))))]
              kept = [(i, j, body) for is_def, i, j, body in parsed
                      if not (is_def and is_address(*(name_value('\n'.join(body)))))]

              if not moved:
                  print('nothing to move, the addresses are already where they belong')
                  return 0

              new_config = []
              for is_def, i, j, body in parsed:
                  keep = not (is_def and is_address(*(name_value('\n'.join(body)))))
                  if keep:
                      new_config.extend(body)
              open(CONFIG, 'w').write('\n'.join(new_config).rstrip('\n') + '\n')

              moved_text = '\n'.join('\n'.join(b) for _, _, b in moved)
              legacy = open(LEGACY).read()
              anchor = legacy.index('typedef struct {')
              merged = legacy[:anchor].rstrip('\n') + '\n\n' + moved_text + '\n\n' + legacy[anchor:]
              open(OFFSETS, 'w').write(merged)

              shim = ('#ifndef OFFSETS_SHIM_H\n#define OFFSETS_SHIM_H\n\n'
                      '#include "core/offsets.h"\n\n#endif\n')
              open(LEGACY, 'w').write(shim)

              for path, old, new in ((IMPORTS, '#import "offsets.h"', '#import "core/offsets.h"'),
                                     (TARGETS, '#include "offsets.h"', '#include "core/offsets.h"')):
                  if not os.path.exists(path):
                      continue
                  text = open(path).read()
                  if old in text:
                      open(path, 'w').write(text.replace(old, new))
                      print('patched', path)

              after = {}
              for path in (CONFIG, OFFSETS):
                  for is_def, i, j, body in blocks(open(path).read().rstrip('\n').split('\n')):
                      if is_def:
                          name, value = name_value('\n'.join(body))
                          if name:
                              after.setdefault(path, {})[name] = value

              flat = {}
              dupes = []
              for path, table in after.items():
                  for name, value in table.items():
                      if name in flat:
                          dupes.append(name)
                      flat[name] = value

              missing = sorted(set(before) - set(flat))
              changed = sorted(n for n in before if n in flat and flat[n] != before[n])

              print('moved to core/offsets.h:', len(moved))
              print('kept in config.h      :', len(before) - len(moved))
              print('duplicate names       :', len(dupes), dupes[:5])
              print('names lost            :', len(missing), missing[:5])
              print('values changed        :', len(changed), changed[:5])
              print('moved names:', ', '.join(name_value('\n'.join(b))[0] for _, _, b in moved[:12]), '...')

              bad = len(dupes) + len(missing) + len(changed)
              print('gates:', 'PASS' if bad == 0 else 'FAIL')
              return 1 if bad else 0


          if __name__ == '__main__':
              sys.exit(main())
          MV
          python3 -c "import ast; ast.parse(open('/tmp/move.py').read())"
          echo "config.h before: $(grep -c '^#define' src/core/config.h) defines"
          python3 /tmp/move.py
          echo "config.h after: $(grep -c '^#define' src/core/config.h) defines"
          echo "core/offsets.h: $(grep -c '^#define' src/core/offsets.h) defines"
          if grep -q '^#define .*_OFF ' src/core/config.h; then
            echo "a field offset is still in config.h"
            grep -n '^#define .*_OFF ' src/core/config.h | head
            exit 1
          fi
          if grep -q '0x' src/offsets.h; then
            echo "src/offsets.h still holds a value, it must only forward"
            exit 1
          fi
          echo "every offset and every address now comes from src/core/offsets.h"

      - name: Build after the move
        run: |
          set -euo pipefail
          gmake clean
          gmake -j"$(sysctl -n hw.ncpu)" ARCHS=arm64 DEBUG=0 FINALPACKAGE=1
          echo "the build is green after the move"

      - name: Check the dylib
        run: |
          set -euo pipefail
          dylib="$(find .theos -type f -name Titanox.dylib ! -path '*.dSYM/*' | sort | head -n 1)"
          test -n "$dylib"
          test -s "$dylib"
          cp "$dylib" /tmp/Titanox.dylib
          xcrun lipo -info /tmp/Titanox.dylib
          shasum -a 256 /tmp/Titanox.dylib
          echo "the dylib is there and is not empty"

      - name: Show what changed
        run: |
          set -euo pipefail
          git status --short
          git diff --stat

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -q -m "move every address into src/core/offsets.h"
          git push
          echo "pushed, both builds were green"
