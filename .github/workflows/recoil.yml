name: Recoil

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recoil-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Theos
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-${{ runner.os }}-v2

      - name: Build
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          [ -f "$THEOS/makefiles/common.mk" ] || bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)" </dev/null
          git clone -q --depth 1 "https://github.com/${{ github.repository_owner }}/Recoil.git" Recoil
          make -j"$(( $(nproc) + 1 ))" ARCHS=arm64 DEBUG=0 FINALPACKAGE=1
          mkdir -p out && cp "$(find .theos -name Recoil.dylib ! -path '*dSYM*' | head -1)" out/Recoil.dylib

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Recoil
          path: out/Recoil.dylib

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/Recoil.dylib
