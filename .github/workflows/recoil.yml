name: Recoil

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recoil-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Theos
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-${{ runner.os }}-v3

      - name: Build
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          if [ ! -f "$THEOS/makefiles/common.mk" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq build-essential fakeroot rsync curl perl zip git libtinfo6 libxml2-16
            sudo update-alternatives --set fakeroot /usr/bin/fakeroot-sysv
            git clone -q --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
            mkdir -p "$THEOS/toolchain"
            curl -sL "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-$(uname -m).tar.xz" | tar -xJ - -C "$THEOS/toolchain/"
            "$THEOS/bin/install-sdk" latest
            lib="$(dpkg -L libxml2-16 | grep 'libxml2\.so\.16$' | head -1)"
            [ -n "$lib" ] && sudo ln -sf "$lib" "$(dirname "$lib")/libxml2.so.2"
          fi
          git clone -q --depth 1 "https://github.com/${{ github.repository_owner }}/Recoil.git" Recoil
          make -j"$(( $(nproc) + 1 ))" ARCHS=arm64 DEBUG=0 FINALPACKAGE=1
          mkdir -p out && cp "$(find .theos -name Recoil.dylib ! -path '*dSYM*' | head -1)" out/Recoil.dylib

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Recoil
          path: out/Recoil.dylib

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/Recoil.dylib
