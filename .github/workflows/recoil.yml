name: Recoil

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Makefile'
      - 'control'
      - 'layout/**'
      - '.github/workflows/recoil.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPS_REPO: ${{ vars.DEPS_REPO || 'Recoil' }}

concurrency:
  group: recoil-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${REPO}.git"
          if ! git fetch -q --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "${REF}"; then
            git fetch -q --depth 1 origin "${REF}"
          fi
          git checkout -q --force FETCH_HEAD
          git rev-parse --short HEAD
          test -f Makefile

      - name: Restore Theos
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-linux-v2
          restore-keys: theos-linux-

      - name: Theos
        run: |
          set -euo pipefail
          if [ ! -f "$HOME/theos/makefiles/common.mk" ]; then
            THEOS="$HOME/theos" \
              bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)" </dev/null
          fi
          test -f "$HOME/theos/makefiles/common.mk"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Deps
        run: |
          set -euo pipefail
          git clone -q --depth 1 "https://github.com/${{ github.repository_owner }}/${DEPS_REPO}.git" Recoil

      - name: Build
        run: |
          set -euo pipefail
          make -j"$(( $(nproc) + 1 ))" ARCHS=arm64 DEBUG=0 FINALPACKAGE=1

      - name: Package
        run: |
          set -euo pipefail
          dylib="$(find .theos -type f -name Recoil.dylib ! -path '*.dSYM/*' | sort | head -n 1)"
          test -n "$dylib"
          mkdir -p out
          cp "$dylib" out/Recoil.dylib
          file out/Recoil.dylib

      - name: Upload Recoil.dylib
        uses: actions/upload-artifact@v4
        with:
          name: Recoil
          path: out/Recoil.dylib
          if-no-files-found: error
          compression-level: 1
